<body class="inventory-mode">
<header class="header no-print">
  <div class="header-title">Inventaire du <time id="headerDate"></time></div>
  <div class="header-category"><div class="category-picker"><button id="categoryButton" class="category-btn"><span id="categoryLabel">Tous</span></button><div id="categoryMenu" class="category-menu" hidden></div></div></div>
  <div class="search-wrap"><span class="search-icon">⌕</span><input id="search" placeholder="Rechercher un produit…" autocomplete="off"><button class="search-clear" id="searchClear" aria-label="Effacer">×</button></div>
  <button class="icon-btn" id="adminButton" aria-label="Administration" title="Administration">⚙</button>
</header>
<main>
<section id="inventoryPanel" class="panel active">
  <div class="summary">
    <div class="summary-top"><span class="summary-title">Suivi du jour</span><span class="summary-stat"><span>Pellets</span><strong id="pelletSummary">0 palette</strong></span><span class="summary-stat"><span>Gaz</span><strong id="gasSummary">0 bouteille</strong></span></div>
    <div class="summary-bottom"><div class="summary-state"><span id="countSummary">0 / 0 comptés</span><span id="anomalySummary">0 anomalie</span><span class="moves" id="movementSummary">0 ajout · 0 retrait</span></div><div class="summary-actions"><button class="btn" id="finishInventoryButton">✓ Valider le comptage</button><button class="btn" id="printButton">Imprimer</button><button class="btn primary" id="closeDayButton">✓ TERMINER LA JOURNÉE</button></div></div>
  </div>
  <div id="inventoryContent"></div>
</section>
<section id="adminPanel" class="panel">
  <div class="page-nav"><button class="back" data-nav="inventory">‹ Stock</button><strong>Administration</strong><span></span></div>
  <div class="admin-menu"><button class="admin-row" data-admin="history"><span><b>Historique</b><small>30 jours d’inventaires</small></span><span>›</span></button><button class="admin-row" data-admin="products"><span><b>Produits et catégories</b><small>Articles, catégories et stocks</small></span><span>›</span></button><button class="admin-row" id="backupButton"><span><b>Sauvegarde</b><small>Créer une sauvegarde de sécurité</small></span><span>↓</span></button><button class="admin-row" id="restoreButton"><span><b>Restaurer / importer V106</b><small>Importer un fichier JSON compatible</small></span><span>↑</span></button><input id="restoreFile" type="file" accept=".json,application/json" hidden></div>
</section>
<section id="productsPanel" class="panel">
  <div class="page-nav"><button class="back" data-nav="admin">‹ Administration</button><strong>Produits et catégories</strong><span></span></div>

function inferCategory(name,type='stock'){
 if(type==='pump')return 'Autres';
 const sets={
  Pellets:new Set(['Allemand','Belge','Perfect','Hollandais','Swiss (63)','Badger']),
  Gaz:new Set(['EasyBlue 6k','EasyBlue 9k','Calypso','CubiShell','MiniGaz','Twiny','Pol 10k','Din 10k','12k','18k','46k','PLT 10k','PLT 18k']),
  'Charbon de bois et bûches':new Set(['ChBois 4k','ChBois 8k','ChBois 10k','Buche Claire','EcoBriquette','Buche Trou','Buche Foncée']),
  'Charbon de chauffage':new Set(['Futurex 30/90','Futurex 20/30','Futurex 12/22','20/30 Spé','20/30 Extra','8/14 Gen','20/30 lbb','14/22 lbb','12/22 Gen','12/22 Extra','12/22 Eco','12/22 Spé','12/22 Ext 10k','14/22 lbb 10k','12/22 Spé 10k','20/30 Spé 10k'])
 };
 for(const [cat,set] of Object.entries(sets))if(set.has(name))return cat;
 if(['LaveGlace','Saxoil','Tosaine','Tosaine +','Huile 2t','Huile 0w30','Huile 0w20','Huile 5w30','Huile 10w40','Huile 15w40','Diecyl','AllFeu Solide','Bidon 10L.','Bidon 25L.','Union 25k','Union 10k'].includes(name))return 'Additifs';

}
function newDay(date=today()){return {date,counts:{},countBaseline:{},delivery:{},withdrawal:{},movementHistory:{delivery:{},withdrawal:{}},serviceFinished:false,serviceFinishedAt:null,postSales:{},postMovement:{delivery:{},withdrawal:{}},finishMovement:{delivery:{},withdrawal:{}}}}
function defaultDb(){return {schema:200,appVersion:APP_VERSION,categories:DEFAULT_CATEGORIES.slice(),products:DEFAULT_PRODUCTS.map((p,i)=>({id:'p'+String(i+1).padStart(3,'0'),name:p.name,prev:p.prev,type:p.type,category:inferCategory(p.name,p.type),active:true,position:i})),day:newDay(),archives:[]}}
function plainMap(value){return value&&typeof value==='object'&&!Array.isArray(value)?value:{}}
function normalizeDay(day){
 const d=day&&typeof day==='object'&&!Array.isArray(day)?clone(day):newDay();
 d.date=/^\d{4}-\d{2}-\d{2}$/.test(String(d.date||''))?String(d.date):today();
 d.counts=plainMap(d.counts); d.countBaseline=plainMap(d.countBaseline); d.delivery=plainMap(d.delivery); d.withdrawal=plainMap(d.withdrawal);
 d.movementHistory=plainMap(d.movementHistory); d.movementHistory.delivery=plainMap(d.movementHistory.delivery); d.movementHistory.withdrawal=plainMap(d.movementHistory.withdrawal);
 if(typeof d.serviceFinished!=='boolean')d.serviceFinished=false;
 if(!('serviceFinishedAt' in d))d.serviceFinishedAt=null;
 d.postSales=plainMap(d.postSales);d.postMovement=plainMap(d.postMovement);d.postMovement.delivery=plainMap(d.postMovement.delivery);d.postMovement.withdrawal=plainMap(d.postMovement.withdrawal);d.finishMovement=plainMap(d.finishMovement);d.finishMovement.delivery=plainMap(d.finishMovement.delivery);d.finishMovement.withdrawal=plainMap(d.finishMovement.withdrawal);
 return d;
}
function normalizedProducts(products){
 const seen=new Set();
 return products.map((p,i)=>{
  p=p&&typeof p==='object'?p:{};
  let id=String(p.id??('p'+String(i+1).padStart(3,'0')));
  if(!id||seen.has(id)){let n=1,base=id||('p'+String(i+1).padStart(3,'0'));while(seen.has(base+'-'+n))n++;id=base+'-'+n} seen.add(id);
  const type=p.type==='pump'?'pump':'stock';
  const name=String(p.name||'Produit');
  const rawPosition=p.position??p.order;
  return {...p,id,name,prev:number(p.prev),type,category:type==='pump'?'Autres':String(p.category||inferCategory(name,type)),active:p.active!==false,position:Number.isFinite(Number(rawPosition))?Number(rawPosition):i};
 });
}
function normalizeArchive(a,fallbackProducts){
 if(!a||typeof a!=='object')return null;
 const data=normalizeDay(a.data||a.day||{date:a.date});
 const date=/^\d{4}-\d{2}-\d{2}$/.test(String(a.date||''))?String(a.date):data.date;
 data.date=date;
 const products=Array.isArray(a.products)&&a.products.length?normalizedProducts(a.products):clone(fallbackProducts);
 return {date,createdAt:a.createdAt||null,reason:String(a.reason||'archive'),data,products};
}
function isCompatibleBackup(raw){return !!(raw&&typeof raw==='object'&&!Array.isArray(raw)&&Array.isArray(raw.products)&&raw.products.length&&raw.products.every(p=>p&&typeof p==='object'&&String(p.name||'').trim()))}
function normalizeDb(raw){
 if(!isCompatibleBackup(raw))throw new Error('format');
 const out=clone(raw); out.schema=200; out.appVersion=APP_VERSION;
 out.products=normalizedProducts(out.products);
 out.categories=Array.isArray(out.categories)&&out.categories.length?[...new Set(out.categories.map(String).filter(Boolean))]:DEFAULT_CATEGORIES.slice();
 out.products.filter(p=>p.type!=='pump').forEach(p=>{if(p.category&&!out.categories.includes(p.category))out.categories.push(p.category)}); if(!out.categories.includes('Autres'))out.categories.push('Autres');
 out.day=normalizeDay(out.day);
 const archiveSource=Array.isArray(out.archives)?out.archives:(Array.isArray(out.backups)?out.backups:[]);
 out.archives=archiveSource.map(a=>normalizeArchive(a,out.products)).filter(Boolean);
 delete out.backups;
 return out;
}
function upgradeAlphaData(out){
 const oilNames={'2t':'Huile 2t','0w30':'Huile 0w30','0w20':'Huile 0w20','5w30':'Huile 5w30','10w40':'Huile 10w40','15w40':'Huile 15w40'};
 (out.products||[]).forEach(p=>{if(oilNames[p.name])p.name=oilNames[p.name]});
 (out.archives||[]).forEach(a=>(a.products||[]).forEach(p=>{if(oilNames[p.name])p.name=oilNames[p.name]}));
 return out;
}
let startupWarning='';
function loadDb(){
 const text=localStorage.getItem(STORAGE_KEY); if(!text)return defaultDb();
 try{return upgradeAlphaData(normalizeDb(JSON.parse(text)))}catch(e){try{localStorage.setItem(CORRUPT_KEY,text)}catch{} startupWarning='Les données V200 enregistrées étaient illisibles. Une copie brute a été conservée dans le stockage de récupération.';return defaultDb()}
}
let db=loadDb();
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}
function saveRecovery(snapshot,reason){try{localStorage.setItem(RECOVERY_KEY,JSON.stringify({savedAt:new Date().toISOString(),reason,data:snapshot}));return true}catch{return false}}
function activeProducts(){return db.products.filter(p=>p.active!==false).sort((a,b)=>a.position-b.position)}
function productById(id){return db.products.find(p=>String(p.id)===String(id))}
function pruneArchives(){const cut=new Date();cut.setHours(0,0,0,0);cut.setDate(cut.getDate()-RETENTION_DAYS);db.archives=(db.archives||[]).filter(a=>{const d=new Date(a.date+'T12:00:00');return Number.isFinite(d.getTime())&&d>=cut})}
function dayHasData(day=db.day){if(!day)return false;if(Object.keys(day.counts||{}).length)return true;if(Object.keys(day.delivery||{}).length||Object.keys(day.withdrawal||{}).length)return true;const h=day.movementHistory||{};return ['delivery','withdrawal'].some(k=>Object.values(h[k]||{}).some(list=>Array.isArray(list)&&list.length>0))}
function prepareNewCalendarDay(){if(!db.day)db.day=newDay();if(db.day.date===today())return false;if(dayHasData(db.day))return false;db.day=newDay(today());save();return true}

/* =========================
   RÈGLES MÉTIER
   ========================= */
function movementList(kind,id){const box=db.day.movementHistory[kind];if(!Array.isArray(box[id])){const legacy=number(db.day[kind]?.[id]);box[id]=legacy>0?[{id:'legacy-'+kind+'-'+id,value:legacy,ts:Date.now(),legacy:true}]:[]}return box[id]}
function movementTotal(kind,id){return movementList(kind,id).reduce((s,m)=>s+number(m.value),0)}
function syncMovement(kind,id){const total=movementTotal(kind,id);if(total>0)db.day[kind][id]=total;else delete db.day[kind][id]}
function postSalesTotal(day,id){return (day.postSales?.[id]||[]).reduce((n,v)=>n+number(v.value),0)}
function postMovementTotal(day,kind,id){return (day.postMovement?.[kind]?.[id]||[]).reduce((n,v)=>n+number(v.value),0)}
function stockState(p,day=db.day){
 const previous=number(p.prev),delivery=number(day.delivery?.[p.id]),withdrawal=number(day.withdrawal?.[p.id]),available=previous+delivery-withdrawal;
 const raw=day.counts?.[p.id],counted=(raw===undefined||raw===null||String(raw).trim()==='')?null:number(raw);
 const phase=day.serviceFinished===true,postSold=phase?postSalesTotal(day,p.id):0;
 // Chaque article garde les totaux des mouvements au moment de son premier comptage.
 // Les livraisons antérieures sont déjà incluses dans le comptage physique.
 // Pour les anciens essais sans repère, conserver leur calcul historique.
 const saved=day.countBaseline?.[p.id];
 const baseAdd=saved?number(saved.delivery):delivery-(phase?postMovementTotal(day,'delivery',p.id):0);
 const baseRemove=saved?number(saved.withdrawal):withdrawal-(phase?postMovementTotal(day,'withdrawal',p.id):0);
 const postAdd=delivery-baseAdd,postRemove=withdrawal-baseRemove;
 const sold=counted===null?null:previous+baseAdd-baseRemove-counted+postSold;
 const current=counted===null?null:counted+postAdd-postRemove-postSold;
 return {previous,delivery,withdrawal,available,counted,sold,current,postAdd,postRemove,postSold,surplus:sold!==null&&sold<0};
}
function pumpState(p,day=db.day){const raw=day.counts?.[p.id];if(raw===undefined||raw===null||String(raw).trim()==='')return {status:'empty',sold:null};const current=number(raw),previous=number(p.prev),sold=current-previous;return sold<0?{status:'lower',current,previous,sold:null}:{status:'ok',current,previous,sold}}
function soldValue(p,day=db.day){return p.type==='pump'?pumpState(p,day).sold:stockState(p,day).sold}
function positiveSoldForCategory(cat){return db.products.filter(p=>p.active!==false&&p.type!=='pump'&&p.category===cat).reduce((s,p)=>{const n=soldValue(p);return s+(Number.isFinite(n)&&n>0?n:0)},0)}
function fuelTotal(kind){const k=kind.toLowerCase();return db.products.filter(p=>p.active!==false&&p.type==='pump'&&((k==='diesel'&&(p.name.toLowerCase().includes('diesel')||p.name.toLowerCase().includes('camion')))||(k==='95'&&p.name.includes('95'))||(k==='98'&&p.name.includes('98')))).reduce((s,p)=>{const n=soldValue(p);return s+(Number.isFinite(n)&&n>0?n:0)},0)}
function closeIssues(){const issues=[];activeProducts().forEach((p,i)=>{const raw=db.day.counts[p.id];if(raw===undefined||raw===null||String(raw).trim()===''){issues.push({kind:'empty',id:p.id,line:i+1,name:p.name,text:p.type==='pump'?'nouvel index non saisi':'nouveau stock non saisi'});return}if(p.type==='pump'){if(pumpState(p).status==='lower')issues.push({kind:'warning',id:p.id,line:i+1,name:p.name,text:'index inférieur à l’ancien index'})}else{const st=stockState(p);if(st.surplus)issues.push({kind:'warning',id:p.id,line:i+1,name:p.name,text:`stock compté ${st.counted} supérieur au disponible ${st.available} (+${Math.abs(st.sold)})`})}});return issues}

function beforeHtml(p){const s=stockState(p);if(!s.delivery&&!s.withdrawal)return `<span class="before-base">${compact(s.previous)}</span>`;const parts=[];if(s.delivery)parts.push(`<span class="move-add">+${compact(s.delivery)}</span>`);if(s.withdrawal)parts.push(`<span class="move-remove">−${compact(s.withdrawal)}</span>`);return `<span class="before-base">${compact(s.previous)}</span><span class="before-moves">${parts.join(' ')}</span><span class="move-total">=${compact(s.available)}</span>`}

function renderInventory(){
 const q=$('#search').value.trim().toLowerCase(); const act=activeProducts(); const stocks=act.filter(p=>p.type!=='pump'&&p.name.toLowerCase().includes(q)&&(!categoryFilter||p.category===categoryFilter)); const pumps=categoryFilter?[]:act.filter(p=>p.type==='pump');

function archiveDay(reason='manual'){db.archives=db.archives||[];const snap={date:db.day.date,createdAt:new Date().toISOString(),reason,data:clone(db.day),products:clone(db.products)};const i=db.archives.findIndex(a=>a.date===snap.date);if(i>=0)db.archives[i]=snap;else db.archives.push(snap);pruneArchives()}

function closeDayNow({reason='closure',download=true,print=true}={}){
 const before=clone(db),closed=clone(db.day),productSnapshot=clone(db.products);

  archiveDay(reason);
  activeProducts().forEach(p=>{if(!Object.prototype.hasOwnProperty.call(closed.counts||{},p.id))return;const raw=closed.counts[p.id];if(raw===undefined||raw===null||String(raw).trim()==='')return;const n=Number(raw);if(!Number.isFinite(n))return;p.prev=p.type==='pump'?n:Math.max(0,stockState(p,closed).current)});
  db.day=newDay(today());
  save();
 }catch(e){db=before;try{save()}catch{};genericDialog({title:'Clôture impossible',text:'Les données ont été conservées. Aucune valeur n’a été perdue.',cancel:false});return false}
 let sideEffectWarning=false;
 if(download){try{downloadBackup('inventaire-v200-cloture')}catch{sideEffectWarning=true}}
 if(print){try{printSnapshot({date:closed.date,data:closed,products:productSnapshot})}catch{sideEffectWarning=true}}

}

   IMPRESSION
   ========================= */
function reportHtml(day=db.day,products=db.products){const all=products.filter(p=>p.active!==false).sort((a,b)=>(a.position??0)-(b.position??0));const stocks=all.filter(p=>p.type!=='pump');const pumps=all.filter(p=>p.type==='pump'&&p.name!=='P Camion');const truck=all.find(p=>p.name==='P Camion');const stockRows=stocks.map(p=>{const s=stockState(p,day);return `<tr><td>${esc(p.name)}</td><td>${compact(s.previous)}</td><td>${compact(s.delivery-s.postAdd)}</td><td>${compact(s.withdrawal-s.postRemove)}</td><td>${compact(s.available-s.postAdd+s.postRemove)}</td><td>${s.counted===null?'':compact(s.counted)}</td><td>${s.counted===null?'':compact(s.sold-s.postSold)}</td></tr>`}).join('');const postRows=day.serviceFinished?stocks.filter(p=>day.counts?.[p.id]!==undefined).map(p=>{const st=stockState(p,day);return `<tr><td>${esc(p.name)}</td><td>${compact(st.counted)}</td><td>${compact(st.postSold)}</td><td>${compact(st.postAdd)}</td><td>${compact(st.postRemove)}</td><td><b>${compact(st.current)}</b></td></tr>`}).join(''):'';const postPage=day.serviceFinished?`<section class="print-page"><h1>Après inventaire — ${formatDate(day.date)}</h1><table><thead><tr><th>Article</th><th>Compté</th><th>Vendu après</th><th>Livré après</th><th>Retiré après</th><th>Stock fermeture</th></tr></thead><tbody>${postRows}</tbody></table></section>`:'';const pumpRows=pumps.map(p=>{const ps=pumpState(p,day);return `<tr><td>${esc(p.name.replace(/ Essence /,' ').replace(' Diesel',''))}</td><td>${esc(fuelBadge(p.name))}</td><td>${compact(p.prev)}</td><td>${ps.current===undefined?'':compact(ps.current)}</td><td>${ps.status==='ok'?compact(ps.sold):ps.status==='lower'?'⚠':''}</td></tr>`}).join('');let truckPage='';if(truck){const ps=pumpState(truck,day);truckPage=`<section class="print-page truck-page"><h1>P Camion — ${formatDate(day.date)}</h1><table><thead><tr><th>Pompe</th><th>Ancien index</th><th>Nouvel index</th><th>Litres</th></tr></thead><tbody><tr><td>P Camion</td><td>${compact(truck.prev)}</td><td>${ps.current===undefined?'':compact(ps.current)}</td><td>${ps.status==='ok'?compact(ps.sold):ps.status==='lower'?'⚠':''}</td></tr></tbody></table></section>`}return `<section class="print-page stock-page"><h1>Inventaire — ${formatDate(day.date)}</h1><table class="stock-table"><thead><tr><th>Article</th><th>Matin</th><th>Ajout</th><th>Retrait</th><th>Disponible</th><th>Compté</th><th>Vendu</th></tr></thead><tbody>${stockRows}</tbody></table></section>${postPage}<section class="print-page fuel-page"><h1>Carburants — ${formatDate(day.date)}</h1><table><thead><tr><th>Pompe</th><th>Carburant</th><th>Ancien index</th><th>Nouvel index</th><th>Litres</th></tr></thead><tbody>${pumpRows}</tbody></table></section>${truckPage}`}
function printSnapshot(snapshot){const day=snapshot.data||snapshot,products=snapshot.products||db.products;const frame=document.createElement('iframe');frame.style.position='fixed';frame.style.width='1px';frame.style.height='1px';frame.style.opacity='0';frame.style.pointerEvents='none';document.body.appendChild(frame);const doc=frame.contentDocument;doc.open();doc.write(`<!doctype html><html><head><meta charset="utf-8"><title>Inventaire</title><style>@page{size:A4 portrait;margin:8mm}body{font-family:Arial,sans-serif;margin:0;color:#1f2a30}.print-page{break-after:page;page-break-after:always}.print-page:last-child{break-after:auto;page-break-after:auto}h1{font-size:14pt;margin:0 0 5mm;color:#35515a}table{width:100%;border-collapse:collapse;font-size:7.2pt;table-layout:fixed}th,td{border:1px solid #bfc9ce;padding:1.2mm;text-align:center}th:first-child,td:first-child{text-align:left}th{background:#edf1f2}.stock-page h1{font-size:11pt;margin:0 0 2mm}.stock-table{font-size:5.8pt}.stock-table tr{height:4.15mm;break-inside:avoid;page-break-inside:avoid}.stock-table th,.stock-table td{height:4.15mm;padding:.08mm .55mm;line-height:1;vertical-align:middle}</style></head><body>${reportHtml(day,products)}</body></html>`);doc.close();setTimeout(()=>{try{frame.contentWindow.focus();frame.contentWindow.print()}finally{setTimeout(()=>frame.remove(),60000)}},150)}
function downloadBackup(prefix='inventaire-v200'){const now=new Date(),stamp=`${localDateString(now)}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}-${String(now.getSeconds()).padStart(2,'0')}`,payload={...clone(db),exportVersion:APP_VERSION,exportedAt:now.toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${prefix}-${stamp}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);return true}

/* =========================
   ADMINISTRATION
   ========================= */
function renderAdmin(){renderCategories();const allActive=db.products.filter(p=>p.active!==false).sort((a,b)=>a.position-b.position),act=allActive.filter(p=>p.type!=='pump'),inactive=db.products.filter(p=>p.active===false&&p.type!=='pump').sort((a,b)=>a.position-b.position),pumps=allActive.filter(p=>p.type==='pump');$('#activeProducts').innerHTML=act.map(p=>`<div class="product-admin-row"><span><b>${esc(p.name)}</b><small style="display:block;color:#7b8b92">${esc(p.category)}</small></span><select data-product-category="${esc(p.id)}">${db.categories.map(c=>`<option ${c===p.category?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="admin-actions"><button class="btn small" data-up="${esc(p.id)}">↑</button><button class="btn small" data-down="${esc(p.id)}">↓</button><button class="btn small danger" data-retire="${esc(p.id)}">Retirer</button></span></div>`).join('');$('#inactiveProducts').innerHTML=inactive.length?inactive.map(p=>`<div class="product-admin-row"><span><b>${esc(p.name)}</b></span><span>${esc(p.category||'Autres')}</span><span class="admin-actions"><button class="btn small" data-restore-product="${esc(p.id)}">Réactiver</button><button class="btn small danger" data-delete-product="${esc(p.id)}">Supprimer</button></span></div>`).join(''):'<span style="color:#78888f">Aucun produit retiré.</span>';$('#categoryAdmin').innerHTML=db.categories.map(c=>`<div class="category-admin-row"><span>${esc(c)}</span><span class="admin-actions"><button class="btn small" data-rename-category="${esc(c)}">Renommer</button>${c!=='Autres'?`<button class="btn small danger" data-delete-category="${esc(c)}">Supprimer</button>`:''}</span></div>`).join('');const stockRows=act.map(p=>`<label>${esc(p.name)}</label><input data-init-stock="${esc(p.id)}" inputmode="numeric" value="${esc(p.prev)}">`).join(''),pumpRows=pumps.map(p=>`<label>${esc(p.name)}</label><input data-init-stock="${esc(p.id)}" inputmode="numeric" value="${esc(p.prev)}">`).join('');$('#stockInit').innerHTML=`<div class="admin-note">À utiliser avant le comptage. Les valeurs AVANT et les anciens index seront remplacés après confirmation.</div><div class="stock-init-grid"><div class="stock-init-section-title">Articles</div>${stockRows}${pumps.length?`<div class="stock-init-section-title">Pompes — anciens index</div>${pumpRows}`:''}</div>`}
function addProduct(){const name=$('#newProductName').value.trim();if(!name)return;const max=Math.max(-1,...db.products.map(p=>p.position??0));db.products.push({id:(globalThis.crypto?.randomUUID?.()||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6))),name,prev:0,type:'stock',category:$('#newProductCategory').value||'Autres',active:true,position:max+1});$('#newProductName').value='';save();renderAdmin();renderInventory()}
function moveProduct(id,delta){const act=db.products.filter(p=>p.active!==false&&p.type!=='pump').sort((a,b)=>a.position-b.position),i=act.findIndex(p=>p.id===id),j=i+delta;if(i<0||j<0||j>=act.length)return;const tmp=act[i].position;act[i].position=act[j].position;act[j].position=tmp;save();renderAdmin();renderInventory()}
async function retireProduct(id){const p=productById(id);if(!p)return;const ok=await genericDialog({title:'Retirer ce produit ?',text:p.name+' restera dans l’historique et pourra être réactivé.',okText:'Retirer',danger:true});if(!ok)return;p.active=false;save();renderAdmin();renderInventory()}
function restoreProduct(id){const p=productById(id);if(!p)return;p.active=true;save();renderAdmin();renderInventory();toast('✓ Produit réactivé à sa position')}
async function deleteProductForever(id){const p=productById(id);if(!p||p.active!==false||p.type==='pump')return;const ok=await genericDialog({title:'Supprimer définitivement cet article ?',text:`${p.name}\n\nIl disparaîtra de la liste actuelle. Les inventaires déjà archivés conservent leur copie historique.`,okText:'Supprimer définitivement',danger:true});if(!ok)return;db.products=db.products.filter(x=>String(x.id)!==String(id));delete db.day.counts[id];delete db.day.delivery[id];delete db.day.withdrawal[id];delete db.day.movementHistory.delivery[id];delete db.day.movementHistory.withdrawal[id];save();renderAdmin();renderInventory();toast('✓ Article supprimé')}
async function renameCategory(cat){const html=`<input id="renameCategoryInput" value="${esc(cat)}">`;const ok=await genericDialog({title:'Renommer la catégorie',html,okText:'Renommer'});if(!ok)return;const next=$('#renameCategoryInput')?.value.trim();if(!next||next===cat)return;if(db.categories.includes(next))return;db.categories=db.categories.map(c=>c===cat?next:c);db.products.forEach(p=>{if(p.category===cat)p.category=next});if(categoryFilter===cat)categoryFilter=next;save();renderAll();renderAdmin()}
async function deleteCategory(cat){const ok=await genericDialog({title:'Supprimer cette catégorie ?',text:'Les produits de cette catégorie seront déplacés vers « Autres ».',okText:'Supprimer',danger:true});if(!ok)return;db.categories=db.categories.filter(c=>c!==cat);db.products.forEach(p=>{if(p.category===cat)p.category='Autres'});if(categoryFilter===cat)categoryFilter='';save();renderAll();renderAdmin()}
async function applyInitialStocks(){const changes=$$('[data-init-stock]').map(i=>{const p=productById(i.dataset.initStock);return p?{p,value:number(i.value)}:null}).filter(Boolean).filter(x=>number(x.p.prev)!==x.value);if(!changes.length){toast('Aucune modification');return}const hasDayData=Object.keys(db.day.counts||{}).length>0||Object.values(db.day.delivery||{}).some(number)||Object.values(db.day.withdrawal||{}).some(number);const text=`${changes.length} valeur${changes.length>1?'s':''} AVANT / ancien index ${changes.length>1?'seront remplacées':'sera remplacée'}.\n\nCette opération n’efface pas les comptages ni les mouvements déjà saisis aujourd’hui.${hasDayData?'\n\n⚠ Des données existent déjà pour la journée en cours.':''}`;const ok=await genericDialog({title:'⚠ Initialiser les stocks ?',text,okText:'Appliquer les nouvelles valeurs'});if(!ok)return;changes.forEach(({p,value})=>{p.prev=value});save();renderAll();renderAdmin();toast('✓ Stocks initiaux enregistrés')}
async function restoreBackup(file){if(!file)return;const before=clone(db);try{const raw=JSON.parse(await file.text());if(!isCompatibleBackup(raw))throw new Error('format');const restored=upgradeAlphaData(normalizeDb(raw));const articleCount=restored.products.filter(p=>p.type!=='pump').length,pumpCount=restored.products.filter(p=>p.type==='pump').length;const ok=await genericDialog({title:'Restaurer cette sauvegarde ?',text:`${articleCount} articles · ${pumpCount} pompes · ${restored.archives.length} archive${restored.archives.length===1?'':'s'}\n\nLa base V200 de test sera remplacée. La V106 reste indépendante.`,okText:'Restaurer'});if(!ok)return;saveRecovery(before,'avant-restauration');db=restored;try{save()}catch(e){db=before;try{save()}catch{};throw e}renderAll();toast('✓ Sauvegarde restaurée')}catch{genericDialog({title:'Fichier invalide',text:'Ce JSON ne contient pas une sauvegarde compatible V200 / V106.',cancel:false})}}

/* =========================
   ÉVÉNEMENTS
   ========================= */
$('#search').addEventListener('input',renderInventory);$('#searchClear').addEventListener('click',()=>{$('#search').value='';renderInventory();$('#search').focus()});$('#categoryButton').addEventListener('click',e=>{e.stopPropagation();$('#categoryMenu').hidden=!$('#categoryMenu').hidden});document.addEventListener('click',e=>{if(!e.target.closest('.category-picker'))$('#categoryMenu').hidden=true});$('#categoryMenu').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;categoryFilter=b.dataset.category;$('#categoryMenu').hidden=true;renderCategories();renderInventory()});
$('#inventoryContent').addEventListener('focusin',e=>{const input=e.target.closest('[data-count]');if(input&&!(db.day.serviceFinished&&productById(input.dataset.count)?.type!=='pump')){activeProductId=input.dataset.count;$$('.sheet-row').forEach(r=>r.classList.toggle('active',r.dataset.productRow===activeProductId))}});$('#inventoryContent').addEventListener('input',e=>{if(e.target.matches('[data-count]')){saveCountInput(e.target);refreshCountDisplay(e.target.dataset.count)}});$('#inventoryContent').addEventListener('change',e=>{if(e.target.matches('[data-count]'))refreshCountDisplay(e.target.dataset.count)});$('#inventoryContent').addEventListener('keydown',e=>{if(e.target.matches('[data-count]'))handleCountKeydown(e)});$('#inventoryContent').addEventListener('click',e=>{const calc=e.target.closest('[data-calc]');if(calc){e.stopPropagation();openCalculator(calc.dataset.calc);return}const mv=e.target.closest('[data-movement]');if(mv){openMovement(mv.dataset.movement);return}const head=e.target.closest('.pump-head');if(head){head.closest('.pump-group').classList.toggle('collapsed');return}const pre=e.target.closest('[data-pre-current]');if(pre){const st=stockState(productById(pre.dataset.preCurrent));toast(`Stock actuel : ${compact(st.current)} · Compté initial : ${compact(st.counted)}`);return}const current=e.target.closest('[data-post-current]');if(current){openPostSale(current.dataset.postCurrent);return}const directInput=e.target.closest('[data-count]');if(directInput){activateCountInput(directInput,{select:true});return}const row=e.target.closest('[data-product-row]');if(row){const current=row.querySelector('[data-post-current]');if(current){openPostSale(current.dataset.postCurrent);return}const input=row.querySelector('[data-count]');activateCountInput(input,{select:true})}});
$('#movementAdd').addEventListener('pointerdown',e=>{e.preventDefault();setMovementKind('delivery')});$('#movementRemove').addEventListener('pointerdown',e=>{e.preventDefault();setMovementKind('withdrawal')});$('#movementAdd').addEventListener('click',()=>setMovementKind('delivery'));$('#movementRemove').addEventListener('click',()=>setMovementKind('withdrawal'));$('#movementSave').addEventListener('click',saveMovement);$('#movementCancel').addEventListener('click',()=>closeOverlay($('#movementOverlay')));$('#movementQty').addEventListener('keydown',e=>{if(e.key==='Enter')saveMovement()});$('#movementHistory').addEventListener('click',e=>{const a=e.target.closest('[data-edit-movement]');if(a)editMovement(a.dataset.editMovement);const d=e.target.closest('[data-delete-movement]');if(d)deleteMovement(d.dataset.deleteMovement)});
const calcKeys=['7','8','9','/','4','5','6','*','1','2','3','-','C','0','⌫','+','='];$('#calculatorGrid').innerHTML=calcKeys.map(k=>`<button class="${k==='='?'equals':k==='C'?'clear':k==='⌫'?'backspace':['/','*','-','+'].includes(k)?'operator':''}" data-calc-key="${esc(k)}">${k==='/'?'÷':k==='*'?'×':k==='-'?'−':esc(k)}</button>`).join('');$('#calculatorGrid').addEventListener('click',e=>{const b=e.target.closest('[data-calc-key]');if(b)calcInput(b.dataset.calcKey)});$('#calculatorCancel').addEventListener('click',()=>closeOverlay($('#calculatorOverlay')));$('#calculatorUse').addEventListener('click',useCalculator);
$('#finishInventoryButton').addEventListener('click',()=>db.day.serviceFinished?reopenInventory():finishInventory());$('#postSaleCancel').addEventListener('click',()=>closeOverlay($('#postSaleOverlay')));$('#postSaleSave').addEventListener('click',savePostSale);$('#postSaleQty').addEventListener('keydown',e=>{if(e.key==='Enter')savePostSale()});$('#postSaleHistory').addEventListener('click',e=>{const b=e.target.closest('[data-cancel-post-sale]');if(b)cancelPostSale(b.dataset.cancelPostSale)});$('#postSaleOverlay').addEventListener('click',e=>{if(e.target===$('#postSaleOverlay'))closeOverlay($('#postSaleOverlay'))});$('#printButton').addEventListener('click',()=>printSnapshot({data:db.day,products:db.products}));$('#closeDayButton').addEventListener('click',requestCloseDay);$('#adminButton').addEventListener('click',()=>showPanel('admin'));$$('[data-nav]').forEach(b=>b.addEventListener('click',()=>showPanel(b.dataset.nav)));$$('[data-admin]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.admin==='history'){renderHistory();showPanel('history')}else{renderAdmin();showPanel('products')}}));$('#backupButton').addEventListener('click',()=>{try{downloadBackup();toast('✓ Sauvegarde créée')}catch{genericDialog({title:'Sauvegarde impossible',text:'Le fichier n’a pas pu être créé. Les données restent enregistrées sur cet appareil.',cancel:false})}});$('#restoreButton').addEventListener('click',()=>$('#restoreFile').click());$('#restoreFile').addEventListener('change',e=>{restoreBackup(e.target.files[0]);e.target.value=''});
$('#adminTabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;$$('#adminTabs button').forEach(x=>x.classList.toggle('active',x===b));$$('.admin-pane').forEach(p=>p.classList.toggle('active',p.dataset.pane===b.dataset.tab));if(b.dataset.tab==='stocks')renderAdmin()});$('#addProductButton').addEventListener('click',addProduct);$('#addCategoryButton').addEventListener('click',()=>{const n=$('#newCategoryName').value.trim();if(!n||db.categories.includes(n))return;db.categories.push(n);$('#newCategoryName').value='';save();renderAdmin();renderCategories()});$('#applyStocksButton').addEventListener('click',applyInitialStocks);$('#activeProducts').addEventListener('change',e=>{const s=e.target.closest('[data-product-category]');if(!s)return;const p=productById(s.dataset.productCategory);if(p){p.category=s.value;save();renderInventory()}});$('#activeProducts').addEventListener('click',e=>{const up=e.target.closest('[data-up]');if(up)moveProduct(up.dataset.up,-1);const down=e.target.closest('[data-down]');if(down)moveProduct(down.dataset.down,1);const r=e.target.closest('[data-retire]');if(r)retireProduct(r.dataset.retire)});$('#inactiveProducts').addEventListener('click',e=>{const b=e.target.closest('[data-restore-product]');if(b){restoreProduct(b.dataset.restoreProduct);return}const d=e.target.closest('[data-delete-product]');if(d)deleteProductForever(d.dataset.deleteProduct)});$('#categoryAdmin').addEventListener('click',e=>{const r=e.target.closest('[data-rename-category]');if(r)renameCategory(r.dataset.renameCategory);const d=e.target.closest('[data-delete-category]');if(d)deleteCategory(d.dataset.deleteCategory)});$('#historyList').addEventListener('click',e=>{const b=e.target.closest('[data-print-archive]');if(!b)return;const a=db.archives.find(x=>x.date===b.dataset.printArchive);if(a)printSnapshot(a)});$('#genericOverlay').addEventListener('click',e=>{if(e.target===$('#genericOverlay'))closeOverlay($('#genericOverlay'))});$('#movementOverlay').addEventListener('click',e=>{if(e.target===$('#movementOverlay'))closeOverlay($('#movementOverlay'))});$('#calculatorOverlay').addEventListener('click',e=>{if(e.target===$('#calculatorOverlay'))closeOverlay($('#calculatorOverlay'))});

let staleWarningDate='';
async function warnStaleDayIfNeeded(){if(!db.day||db.day.date===today()||!dayHasData(db.day)||staleWarningDate===db.day.date)return;staleWarningDate=db.day.date;await genericDialog({title:'Inventaire précédent non clôturé',text:`L’inventaire du ${formatDate(db.day.date)} contient encore des données. Il reste ouvert pour éviter toute perte. Complétez-le puis utilisez « Terminer la journée » avant de commencer aujourd’hui.`,cancel:false,okText:'Revenir au comptage'});showPanel('inventory')}
function handleCalendarChange(){if(prepareNewCalendarDay())renderAll();else warnStaleDayIfNeeded()}
function renderAll(){prepareNewCalendarDay();$('#headerDate').textContent=formatDate(db.day.date);renderCategories();renderInventory();updateFinishButton()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')handleCalendarChange()});window.addEventListener('focus',handleCalendarChange);
renderAll();if(!startupWarning)save();setTimeout(()=>{if(startupWarning)genericDialog({title:'Récupération V200',text:startupWarning,cancel:false,okText:'Continuer'});else warnStaleDayIfNeeded()},0);
</script>
