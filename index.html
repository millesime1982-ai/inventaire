<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c5e">
<link rel="manifest" href="./manifest.webmanifest">
<title>Inventaire V200</title>
<style>
:root { --petrol: #35515a; --petrol-2: #294852; --teal: #0f5c5e; --line: #d8dee2; --soft: #f4f6f7; --blue: #eef7ff; --text: #1f2a30; --muted: #6c7b82; --danger: #b42318; --ok: #18794e; --amber: #9a6700; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button:focus:not(:focus-visible), [role="button"]:focus:not(:focus-visible) { outline: none; }
html,
body { margin: 0; background: #fff; color: var(--text); font-family: Arial,Helvetica,sans-serif; font-size: 14px; }
button,
input,
select { font: inherit; }
button { cursor: pointer; }
body.modal-open { overflow: hidden; }
.header { position: sticky; top: 0; z-index: 40; width: 100%; max-width: 760px; margin: 0 auto; background: #fff; border-bottom: 1px solid #e5e9eb; padding: 9px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; box-shadow: 0 2px 8px rgba(38,49,61,.04); }
.header-title { display: flex; align-items: baseline; gap: 7px; color: #35515a; font-size: 20px; font-weight: 900; white-space: nowrap; min-width: 0; order: 1; flex: 1 1 auto; }
.header-title time { font-size: 12px; font-weight: 700; color: #74818a; }
.icon-btn { width: 38px; height: 38px; border: 1px solid #d9e1e5; border-radius: 50%; background: #fff; color: var(--petrol); font-size: 20px; display: flex; align-items: center; justify-content: center; padding: 0; }
#adminButton { order: 2; flex: 0 0 auto; margin-left: auto; }
body.inventory-mode .header { min-height: 50px; flex-wrap: nowrap; padding: 8px 18px; }
main { padding: 10px 12px 40px; max-width: 760px; margin: 0 auto; }
.panel { display: none; }
.panel.active { display: block; }
.summary { border: 1px solid #d3dcdf; border-radius: 10px; overflow: hidden; background: #fff; margin: 10px 0 12px; }
.summary-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; }
.summary-state { display: flex; gap: 10px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; }
.summary-state span { font-weight: 700; color: #344a54; }
.summary-actions { display: flex; gap: 8px; flex: 0 0 auto; }
.btn { border: 1px solid #c6d0d4; background: #fff; border-radius: 8px; min-height: 34px; padding: 0 12px; color: #344a54; font-weight: 700; }
.btn.primary { background: #0f5c5e; border-color: #0f5c5e; color: #fff; }
.btn.danger { background: #fff; border-color: #d92d20; color: #b42318; }
.btn.small { min-height: 30px; padding: 0 9px; font-size: 12px; }
.category-chips { display: flex; gap: 7px; overflow-x: auto; white-space: nowrap; padding: 2px 1px 9px; margin: 0 0 8px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
.category-chips button { flex: 0 0 auto; min-height: 38px; border: 1px solid #b8c5ca; border-radius: 19px; background: #fff; color: #344a54; padding: 7px 13px; font-weight: 750; font-size: 12px; }
.category-chips button.active { background: #0f5c5e; color: #fff; border-color: #0f5c5e; }
.sheet { border: 1px solid #cfd7da; border-radius: 8px; overflow: hidden; }
.sheet-head,
.sheet-row { display: grid; grid-template-columns: minmax(0,1fr) 192px 140px 102px; align-items: center; }
.sheet-head { height: 36px; background: #edf0f2; color: #52656d; font-size: 11px; font-weight: 800; letter-spacing: .04em; }
.sheet-head span { text-align: center; }
.sheet-head span:first-child { text-align: left; padding-left: 14px; }
.sheet-row { min-height: 50px; border-top: 1px solid #e1e6e8; position: relative; background: #fff; }
.sheet-row:first-of-type { border-top: 0; }
.sheet-row.active { background: #ddecef; }
.sheet-row.active:before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #35515a; }
.sheet-row.warning { background: #fffefa; box-shadow: inset 3px 0 #dfa03a; }
.cell { min-width: 0; padding: 5px 8px; text-align: center; }
.name-cell { display: flex; align-items: center; gap: 6px; text-align: left; padding-left: 12px; overflow: hidden; }
.name-cell strong { font-size: 17px; font-weight: 500; color: #1f2a30; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.warn { width: 16px; color: #a65d00; font-weight: 900; text-align: center; }
.before-cell { cursor: pointer; line-height: 1.1; text-align: left; padding-right: 30px; }
.before-chip { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: min(130px, 100%); min-height: 40px; padding: 3px 0 3px 28px; }
.movement-btn { position: absolute; top: 50%; left: -7px; transform: translateY(-50%); display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.movement-btn::before { content: '±'; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #e3edf0; color: #5b7d87; font-size: 14px; font-weight: 700; line-height: 1; transition: transform .1s, background .1s; }
.movement-btn:active::before, .before-cell:active .movement-btn::before { transform: scale(.85); background: #bcd5db; }
.before-base { font-size: 18px; font-weight: 800; }
.before-calc { display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.calc-total { white-space: nowrap; }
.calc-total { font-size: 18px; font-weight: 800; color: #1f2a30; }
.calc-detail { font-size: 12px; color: #7a898f; white-space: nowrap; }
.move-add { color: #18794e; font-weight: 700; }
.move-remove { color: #b42318; font-weight: 700; }
.count-input { width: 88px; height: 38px; border: 2px solid #aebbc1; border-radius: 7px; background: #fff; text-align: center; font-size: 22px; font-weight: 850; outline: none; color: #1e2d34; }
.count-input:focus { border-color: #294852; }
.summary-actions { flex-wrap: wrap; justify-content: flex-end; }
.sold-cell { font-size: 20px; font-weight: 850; }
.sold-cell.surplus { color: #a65d00; }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed #cbd4d8; border-radius: 8px; }
.pump-section { margin-top: 15px; }
.pump-section h3 { font-size: 14px; color: #35515a; margin: 0 0 8px; }
.pump-group { border: 1px solid #cbd4d8; border-radius: 8px; margin-bottom: 8px; overflow: hidden; background: #fff; }
.pump-head { width: 100%; height: 42px; border: 0; background: #edf1f2; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: #2f4852; font-weight: 800; }
.pump-status { font-size: 12px; color: #62747b; }
.pump-status.complete { color: #18794e; }
.pump-body { padding: 9px; }
.pump-fuel { display: grid; grid-template-columns: 130px minmax(190px,1fr); gap: 12px; align-items: center; padding: 7px 4px; border-top: 1px solid #edf0f1; }
.pump-fuel:first-child { border-top: 0; }
.fuel-badge { display: inline-flex; align-items: center; gap: 5px; width: max-content; border-radius: 5px; padding: 5px 8px; font-size: 12px; font-weight: 900; }
.fuel-diesel .fuel-badge { background: #f4cc24; color: #111; }
.fuel-95 .fuel-badge { background: #72c987; color: #102b16; }
.fuel-98 .fuel-badge { background: #126c45; color: #fff; }
.pump-entry { display: flex; align-items: center; gap: 10px; }
.pump-entry input { width: 150px; }
.pump-meta { font-size: 12px; color: #5f7078; line-height: 1.35; }
.pump-meta strong { color: #304750; }
.pump-meta .bad { color: #a65d00; font-weight: 800; }
.toast { position: fixed; z-index: 100; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); background: #243b44; color: #fff; border-radius: 9px; padding: 10px 14px; opacity: 0; pointer-events: none; transition: .2s; box-shadow: 0 8px 25px rgba(0,0,0,.2); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.overlay { position: fixed; z-index: 90; inset: 0; background: rgba(16,32,39,.38); display: none; align-items: center; justify-content: center; padding: 16px; }
#genericOverlay { z-index: 115; }
.overlay.open { display: flex; }
.dialog { width: min(520px,100%); max-height: 88vh; overflow: auto; background: #fff; border-radius: 13px; box-shadow: 0 18px 55px rgba(0,0,0,.25); padding: 18px; }
.dialog h2 { font-size: 18px; color: #263b45; margin: 0 0 7px; }
.dialog p { white-space: pre-line; color: #52656d; line-height: 1.4; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.dialog input,
.dialog select { width: 100%; height: 42px; border: 1px solid #cbd4d8; border-radius: 8px; padding: 0 10px; margin-top: 7px; }
.segment { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 12px 0; }
.segment button { height: 42px; border: 1px solid #cbd4d8; border-radius: 8px; background: #fff; font-weight: 800; }
.segment button.selected.add { background: #ebf7ef; border-color: #8bc49e; color: #18794e; }
.segment button.selected.remove { background: #fff0ee; border-color: #e0a39c; color: #b42318; }
.movement-history-title { margin: 14px 0 5px; font-size: 12px; font-weight: 800; color: #60747c; text-transform: uppercase; letter-spacing: .03em; }
.movement-list { max-height: 220px; overflow: auto; border-top: 1px solid #e3e7e9; margin-top: 0; }
.movement-item { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 8px 2px; border-bottom: 1px solid #edf0f1; }
.movement-item.add { color: #18794e; }
.movement-item.remove { color: #b42318; }
.page-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 4px 0 14px; }
.back { justify-self: start; border: 0; background: transparent; color: #0f5c5e; font-weight: 800; padding: 8px 0; }
.page-nav strong { font-size: 18px; color: #263b45; }
.admin-menu { border: 1px solid #cbd4d8; border-radius: 10px; overflow: hidden; }
.admin-row { width: 100%; min-height: 58px; border: 0; border-top: 1px solid #e3e7e9; background: #fff; padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
.admin-row:first-child { border-top: 0; }
.admin-row b { display: block; color: #304750; }
.admin-row small { display: block; color: #7a898f; margin-top: 2px; }
.tabs { display: flex; gap: 5px; border-bottom: 1px solid #dbe2e5; margin-bottom: 12px; }
.tabs button { border: 0; background: transparent; padding: 10px 12px; color: #64767e; font-weight: 800; border-bottom: 3px solid transparent; }
.tabs button.active { color: #0f5c5e; border-color: #0f5c5e; }
.admin-pane { display: none; }
.admin-pane.active { display: block; }
.card { border: 1px solid #d4dce0; border-radius: 10px; padding: 12px; background: #fff; margin-bottom: 10px; }
.form-row { display: grid; grid-template-columns: minmax(180px,1fr) 220px auto; gap: 8px; }
.form-row input,
.form-row select { height: 40px; border: 1px solid #cbd4d8; border-radius: 8px; padding: 0 10px; }
.product-admin-row { display: grid; grid-template-columns: 44px minmax(140px,1fr) 170px auto; gap: 7px; align-items: center; padding: 6px 4px; border-bottom: 1px solid #edf0f1; min-height: 48px; }
.product-admin-row.dragging { opacity: .55; background: #eef7f7; }
.drag-handle { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 38px; border: 1px solid #aebcc2; border-radius: 8px; background: #eef4f6; color: #294852; font-size: 24px; font-weight: 900; touch-action: none; user-select: none; cursor: grab; }
.drag-handle:active { background: #dcebed; }
.product-admin-name { min-width: 0; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.product-admin-row>select { width: 100%; min-width: 0; height: 38px; border: 1px solid #cbd4d8; border-radius: 7px; background: #fff; padding: 0 6px; }
.product-admin-row.drag-over { box-shadow: inset 0 3px #0f5c5e; }
.product-admin-row:last-child { border-bottom: 0; }
.admin-actions { display: flex; gap: 5px; justify-content: flex-end; }
.category-admin-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 4px; border-bottom: 1px solid #edf0f1; }
.stock-init-grid { display: grid; grid-template-columns: 1fr 150px; gap: 7px; align-items: center; }
.stock-init-grid input { height: 38px; border: 1px solid #cbd4d8; border-radius: 8px; text-align: center; font-weight: 800; }
.stock-init-section-title { grid-column: 1/-1; margin: 8px 0 2px; padding-top: 8px; border-top: 1px solid #e5eaec; color: #35515a; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .03em; }
.stock-init-section-title:first-child { border-top: 0; padding-top: 0; }
.admin-note { margin: 0 0 10px; padding: 9px 10px; border: 1px solid #ead8aa; background: #fffaf0; border-radius: 8px; color: #6e5a25; font-size: 12px; line-height: 1.35; }
.history-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #edf0f1; padding: 10px 2px; }
.history-row:last-child { border-bottom: 0; }
.close-issues { max-height: 270px; overflow: auto; border: 1px solid #ead8aa; background: #fffaf0; border-radius: 8px; margin-top: 10px; }
.issue { padding: 8px 10px; border-bottom: 1px solid #efe1bc; }
.issue:last-child { border-bottom: 0; }
@media(max-width:760px) {
  body.inventory-mode .header { padding-left: 12px; padding-right: 12px; }
  .header-title { font-size: 19px; }
  main { padding: 8px 12px 30px; }
  .summary-bottom { padding: 7px 9px; gap: 6px; }
  .summary-state { gap: 6px; font-size: 12px; }
  .summary-actions { gap: 5px; }
  .summary-actions .btn { padding: 0 8px; font-size: 11px; }
  .sheet-head,
  .sheet-row { grid-template-columns: minmax(0,1fr) 184px 134px 98px; }
  .pump-fuel { grid-template-columns: 115px 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .product-admin-row { grid-template-columns: 44px minmax(120px,1fr) 150px auto; }
}
@media(max-width:620px) {
  .header-title { font-size: 16px; }
  .summary-bottom { align-items: flex-start; }
  .summary-state { flex-wrap: wrap; white-space: normal; }
  .sheet-head,
  .sheet-row { grid-template-columns: minmax(0,1fr) 142px 90px 72px; }
  .before-cell { text-align: center; padding-right: 2px; }
  .before-chip { width: min(134px, 100%); padding: 3px 0 3px 26px; }
  .movement-btn { left: -8px; width: 42px; height: 42px; }
  .movement-btn::before { width: 24px; height: 24px; font-size: 14px; }
  .calc-detail { font-size: 11px; }
  .sold-cell { font-size: 19px; }
  .sheet-head span:first-child { padding-left: 8px; }
  .cell { padding: 4px; }
  .name-cell { padding-left: 8px; }
  .count-input { width: 100%; font-size: 21px; }
  .pump-fuel { grid-template-columns: 1fr; }
  .pump-entry { flex-wrap: wrap; }
  .product-admin-row { grid-template-columns: 40px minmax(105px,1fr) 125px auto; gap: 4px; }
  .product-admin-row .btn.small { padding: 0 6px; }
  .drag-handle { width: 36px; }
  .product-admin-row>select { font-size: 12px; }
}
.current-stock-button { width: 88px; min-height: 38px; border: 2px solid #a9c9b7; border-radius: 7px; background: #f1faf5; color: #17633e; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3px 1px; }
.current-stock-button strong { font-size: 19px; line-height: 1.15; }
.current-stock-button small { font-size: 10px; line-height: 1.25; color: #526a5c; white-space: nowrap; }
@media(max-width:620px) {
  .current-stock-button { width: 70px; }
  .current-stock-button strong { font-size: 17px; }
  .current-stock-button small { font-size: 9px; }
}
/* Fenêtres mobiles : conserver les actions accessibles avec le clavier affiché. */
.overlay.open { top: var(--keyboard-viewport-top,0px); height: calc(var(--keyboard-viewport-height,100dvh) - var(--numpad-h,0px)); bottom: auto; box-sizing: border-box; align-items: center; padding: 8px 12px; }
.overlay .dialog { max-height: calc(var(--keyboard-viewport-height,100dvh) - var(--numpad-h,0px) - 16px); overscroll-behavior: contain; scroll-padding-bottom: 68px; }
.overlay .dialog-actions { position: sticky; bottom: -18px; z-index: 2; background: #fff; padding: 10px 0 12px; margin-top: 10px; border-top: 1px solid #e3e7e9; }
.overlay .dialog-actions .btn { min-height: 42px; }
@media(max-height:600px) {
  .overlay .dialog { padding: 12px; }
  .dialog h2 { font-size: 16px; }
}
/* Calculatrice simplifiée : quatre rangées, puis = pleine largeur. */
/* Stock réel visible dès une livraison/retrait après le comptage de l'article. */
/* Version allégée : suivi compact et fenêtre de vente réduite */
.compact-summary { margin: 6px 0 8px; }
.compact-summary .summary-bottom { padding: 6px 9px; min-height: 38px; }
.compact-day { gap: 16px!important; overflow: visible!important; }
.compact-day span { font-size: 12px; font-weight: 700; color: #52666f; }
.compact-day strong { font-size: 14px; color: #0f5c5e; margin-left: 3px; }
.post-sale-dialog { max-width: 560px; }
.post-sale-dialog h2 { margin-bottom: 12px; }
.post-sale-dialog .dialog-actions { margin-top: 12px; }
/* ESSAI ISOLÉ : pompes toujours visibles, carburants en colonnes. */
.pump-group { overflow: visible; margin-bottom: 12px; }
.pump-head { width: 100%; height: auto; min-height: 40px; cursor: default; border-radius: 8px 8px 0 0; }
.pump-body { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; padding: 9px; }
.pump-fuel { display: flex; flex-direction: column; align-items: stretch; gap: 9px; border: 1px solid #cbd4d8; border-radius: 9px; padding: 10px 7px; background: #fff; min-width: 0; }
.pump-fuel:first-child { border-top: 1px solid #cbd4d8; }
.fuel-badge { width: 100%; justify-content: center; text-align: center; min-height: 32px; }
.pump-entry { display: flex; flex-direction: column; align-items: stretch; gap: 7px; min-width: 0; }
.pump-entry input { width: 100%; max-width: none; height: 44px; font-size: 18px; }
.pump-old { font-size: 11px; text-align: center; color: #52656d; overflow-wrap: anywhere; }
.pump-old strong { display: block; font-size: 13px; color: #304750; }
.pump-meta { text-align: center; font-size: 12px; min-height: 20px; }
.pump-group:has(.pump-fuel:only-child) .pump-body { grid-template-columns: repeat(3,minmax(0,1fr)); }
.pump-group:has(.pump-fuel:only-child) .pump-fuel { grid-column: 1/2; }
@media(max-width:430px) {
  .pump-body { gap: 5px; padding: 6px; }
  .pump-fuel { padding: 8px 4px; }
  .pump-old { font-size: 10px; }
  .pump-old strong { font-size: 11px; }
  .pump-entry input { font-size: 15px; padding: 2px; }
  .pump-meta { font-size: 11px; }
}
/* Alignement tablette des statistiques Pellet / Gaz */
.compact-summary .summary-bottom { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.compact-summary .compact-day { display: grid!important; grid-template-columns: repeat(2,max-content); align-items: center; justify-content: start; column-gap: 24px!important; row-gap: 6px; flex: 0 1 auto; min-width: 0; }
.compact-summary .compact-day>span { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; font-size: 13px; }
.compact-summary .compact-day strong { margin-left: 0; font-size: 15px; font-variant-numeric: tabular-nums; }
.compact-summary .summary-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
@media(max-width:640px) {
  .compact-summary .summary-bottom { justify-content: center; }
  .compact-summary .compact-day { width: 100%; grid-template-columns: 1fr 1fr; justify-items: center; }
  .compact-summary .summary-actions { width: 100%; margin-left: 0; justify-content: center; }
}
/* Catégories toujours visibles pendant le défilement. */
body.inventory-mode #categoryMenu { position: sticky; top: var(--inventory-header-height,54px); z-index: 39; background: #fff; margin-top: 0; padding-top: 7px; padding-bottom: 9px; border-bottom: 1px solid #dbe3e5; box-shadow: 0 3px 7px rgba(31,42,48,.05); }
/* Pavé numérique intégré (avec calcul) */
#numpad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 130; display: none; background: #f4f6f7; border-top: 1px solid #c6d0d4; box-shadow: 0 -6px 22px rgba(0,0,0,.16); padding: 8px 10px calc(10px + env(safe-area-inset-bottom,0px)); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#numpad.open { display: block; }
.numpad-inner { max-width: 520px; margin: 0 auto; }
.numpad-top { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr) 42px; gap: 8px; align-items: center; margin-bottom: 7px; }
.numpad-label { font-size: 12px; font-weight: 800; color: #52656d; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.numpad-screen { display: flex; align-items: baseline; justify-content: flex-end; gap: 8px; min-width: 0; font-size: 20px; font-weight: 800; color: #253d47; }
#numpadExpr { overflow-wrap: anywhere; text-align: right; }
.numpad-screen strong { color: #177348; white-space: nowrap; }
.numpad-close { justify-self: end; display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #e3e9ec; color: #5b6f77; padding: 0; transition: transform .12s, background .12s; }
.numpad-close svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; fill: none; }
.numpad-close:active { transform: scale(.88); background: #cfd9de; }
.numpad-grid { display: grid; grid-template-columns: .6fr repeat(3,1fr) .6fr; gap: 6px; }
.numpad-grid button { height: 52px; border: 1px solid #c6d0d4; border-radius: 10px; background: #fff; font-size: 23px; font-weight: 800; color: #1f2a30; touch-action: manipulation; }
.numpad-grid button:active { background: #e2ecef; }
.numpad-grid .operator { background: #eaf4f2; color: #125b5b; border-color: #c7dfd9; }
.numpad-grid .clear { background: #fff0f0; color: #ba3030; border-color: #f1b9b9; }
.numpad-grid .backspace { background: #fff8e8; color: #8c6215; border-color: #ead39d; }
.numpad-grid .equals { grid-column: span 2; background: #eaf4f2; color: #125b5b; border-color: #c7dfd9; }
.numpad-grid .enter { background: #125b5b; color: #fff; border-color: #125b5b; font-size: 19px; }
.numpad-grid .operator, .numpad-grid .clear, .numpad-grid .backspace { font-size: 20px; }
.numpad-grid .clear, .numpad-grid .backspace { height: auto; }
/* Chiffres au centre, effacer à gauche et opérateurs à droite : le pavé est symétrique. */
.numpad-grid [data-np-key="C"] { grid-area: 1 / 1 / 3 / 2; }
.numpad-grid [data-np-key="⌫"] { grid-area: 3 / 1 / 5 / 2; }
.numpad-grid [data-np-key="7"] { grid-area: 1 / 2; }
.numpad-grid [data-np-key="8"] { grid-area: 1 / 3; }
.numpad-grid [data-np-key="9"] { grid-area: 1 / 4; }
.numpad-grid [data-np-key="4"] { grid-area: 2 / 2; }
.numpad-grid [data-np-key="5"] { grid-area: 2 / 3; }
.numpad-grid [data-np-key="6"] { grid-area: 2 / 4; }
.numpad-grid [data-np-key="1"] { grid-area: 3 / 2; }
.numpad-grid [data-np-key="2"] { grid-area: 3 / 3; }
.numpad-grid [data-np-key="3"] { grid-area: 3 / 4; }
.numpad-grid [data-np-key="0"] { grid-area: 4 / 2 / 5 / 5; }
.numpad-grid [data-np-key="/"] { grid-area: 1 / 5; }
.numpad-grid [data-np-key="*"] { grid-area: 2 / 5; }
.numpad-grid [data-np-key="-"] { grid-area: 3 / 5; }
.numpad-grid [data-np-key="+"] { grid-area: 4 / 5; }
.numpad-grid [data-np-key="="] { grid-area: 5 / 1 / 6 / 3; }
.numpad-grid [data-np-key="enter"] { grid-area: 5 / 3 / 6 / 6; }
@media(max-height:620px) {
  .numpad-grid button { height: 42px; font-size: 20px; }
  .numpad-grid { gap: 5px; }
}
/* Téléphone : textes un peu plus petits pour garder les noms lisibles. */
@media(max-width:460px) {
  .sheet-head,
  .sheet-row { grid-template-columns: minmax(0,1fr) 112px 72px 56px; }
  .name-cell strong { font-size: 15px; }
  .before-chip { width: min(104px, 100%); padding-left: 24px; }
  .before-base, .calc-total { font-size: 16px; }
  .calc-detail { font-size: 9.5px; }
  .count-input { font-size: 19px; }
  .sold-cell { font-size: 17px; }
}
/* Écran bas (tablette en paysage) : pavé plus compact pour laisser de la place aux fenêtres. */
@media(max-height:620px) {
  #numpad { padding-top: 5px; }
  .numpad-top { margin-bottom: 4px; }
  .numpad-grid { gap: 4px; }

  .numpad-grid .clear, .numpad-grid .backspace { height: auto; }
  .overlay .dialog { padding: 10px 14px; }
  .overlay .dialog h2 { font-size: 16px; margin: 0 0 2px; }
  .overlay .dialog p { margin: 2px 0 6px; line-height: 1.25; font-size: 13px; }
  .overlay .dialog .segment button { height: 38px; }

}
body.numpad-open main { padding-bottom: calc(var(--numpad-h,0px) + 24px); }
body.numpad-open .toast { bottom: calc(var(--numpad-h,0px) + 14px); }

}

function syncKeyboardViewport() {

  document.documentElement.style.setProperty('--keyboard-viewport-top', (v ? v.offsetTop : 0) + 'px')
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncKeyboardViewport);

}
window.addEventListener('resize', syncKeyboardViewport);
document.addEventListener('focusin', e => {

const $ = s => document.querySelector(s);

const today = () => localDateString();

function inferCategory(name, type = 'stock') {
  if (type === 'pump') return 'Autres';
  return Object.keys(CATEGORY_MEMBERS).find(cat => CATEGORY_MEMBERS[cat].includes(name)) || 'Autres'
}

function newDay(date = today()) {
  return {
    date,
    counts: {},
    countBaseline: {},
    countMovementIds: {},
    delivery: {},
    withdrawal: {},
    movementHistory: {delivery: {}, withdrawal: {}},
    serviceFinished: false,
    serviceFinishedAt: null,
    postSales: {},
    postMovement: {delivery: {}, withdrawal: {}},
    finishMovement: {delivery: {}, withdrawal: {}}
  }
}

function defaultDb() {
  const products = DEFAULT_PRODUCTS.map((p, i) => ({
    id: 'p' + String(i + 1).padStart(3, '0'),
    name: p.name,
    prev: p.prev,
    type: p.type,
    category: inferCategory(p.name, p.type),
    active: true,
    position: i
  }));
  return {schema: 200, appVersion: APP_VERSION, categories: DEFAULT_CATEGORIES.slice(), products, day: newDay(), archives: []}
}

function plainMap(value) {
  return value && typeof value === 'object' && !Array.isArray(value) ? value : {}
}

// Boîte de mouvements : toujours un objet {delivery: {...}, withdrawal: {...}}.
function normalizeMovementBox(box) {
  box = plainMap(box);
  box.delivery = plainMap(box.delivery);
  box.withdrawal = plainMap(box.withdrawal);
  return box
}

function normalizeDay(day) {
  const d = day && typeof day === 'object' && !Array.isArray(day) ? clone(day) : newDay();
  d.date = /^\d{4}-\d{2}-\d{2}$/.test(String(d.date || '')) ? String(d.date) : today();
  for (const key of ['counts', 'countBaseline', 'countMovementIds', 'delivery', 'withdrawal', 'postSales']) d[key] = plainMap(d[key]);
  for (const key of ['movementHistory', 'postMovement', 'finishMovement']) d[key] = normalizeMovementBox(d[key]);
  if (typeof d.serviceFinished !== 'boolean') d.serviceFinished = false;
  if (!('serviceFinishedAt' in d)) d.serviceFinishedAt = null;
  return d;
}

function normalizedProducts(products) {
  const seen = new Set();
  return products.map((p, i) => {
    p = p && typeof p === 'object' ? p : {};
    let id = String(p.id ?? ('p' + String(i + 1).padStart(3, '0')));
    if (!id || seen.has(id)) {
      let n = 1, base = id || ('p' + String(i + 1).padStart(3, '0'));
      while (seen.has(base + '-' + n)) n++;
      id = base + '-' + n
    }
    seen.add(id);
    const type = p.type === 'pump' ? 'pump' : 'stock';
    const name = String(p.name || 'Produit');
    const rawPosition = p.position ?? p.order;
    return {...p, id, name, prev: number(p.prev), type, category: type === 'pump' ? 'Autres' : String(p.category || inferCategory(name, type)), active: p.active !== false, position: Number.isFinite(Number(rawPosition)) ? Number(rawPosition) : i};
  });
}

function normalizeArchive(a, fallbackProducts) {
  if (!a || typeof a !== 'object') return null;
  const data = normalizeDay(a.data || a.day || {date: a.date});
  const date = /^\d{4}-\d{2}-\d{2}$/.test(String(a.date || '')) ? String(a.date) : data.date;
  data.date = date;
  const products = Array.isArray(a.products) && a.products.length ? normalizedProducts(a.products) : clone(fallbackProducts);
  return {date, createdAt: a.createdAt || null, reason: String(a.reason || 'archive'), data, products};
}

function isCompatibleBackup(raw) {
  return !!(raw && typeof raw === 'object' && !Array.isArray(raw) && Array.isArray(raw.products) && raw.products.length && raw.products.every(p => p && typeof p === 'object' && String(p.name || '').trim()))
}

function normalizeDb(raw) {
  if (!isCompatibleBackup(raw)) throw new Error('format');
  const out = clone(raw);
  out.schema = 200;
  out.appVersion = APP_VERSION;
  out.products = normalizedProducts(out.products);
  out.categories = Array.isArray(out.categories) && out.categories.length ? [...new Set(out.categories.map(String).filter(Boolean))] : DEFAULT_CATEGORIES.slice();
  out.products.filter(p => p.type !== 'pump').forEach(p => {
    if (p.category && !out.categories.includes(p.category)) out.categories.push(p.category)
  });
  if (!out.categories.includes('Autres')) out.categories.push('Autres');
  out.day = normalizeDay(out.day);
  const archiveSource = Array.isArray(out.archives) ? out.archives : (Array.isArray(out.backups) ? out.backups : []);
  out.archives = archiveSource.map(a => normalizeArchive(a, out.products)).filter(Boolean);
  delete out.backups;
  return out;
}

function upgradeAlphaData(out) {
  const oilNames = {'2t': 'Huile 2t', '0w30': 'Huile 0w30', '0w20': 'Huile 0w20', '5w30': 'Huile 5w30', '10w40': 'Huile 10w40', '15w40': 'Huile 15w40'};
  (out.products || []).forEach(p => {
    if (oilNames[p.name]) p.name = oilNames[p.name]
  });
  (out.archives || []).forEach(a => (a.products || []).forEach(p => {
    if (oilNames[p.name]) p.name = oilNames[p.name]
  }));
  return out;
}
let startupWarning = '';

function loadDb() {
  const text = localStorage.getItem(STORAGE_KEY);
  if (!text) return defaultDb();
  try {
    return upgradeAlphaData(normalizeDb(JSON.parse(text)))
  } catch (e) {
    try {
      localStorage.setItem(CORRUPT_KEY, text)
    } catch{}
    startupWarning = 'Les données V200 enregistrées étaient illisibles. Une copie brute a été conservée dans le stockage de récupération.';
    return defaultDb()
  }
}
let db = loadDb();

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db))
}

function saveRecovery(snapshot, reason) {
  try {
    localStorage.setItem(RECOVERY_KEY, JSON.stringify({savedAt: new Date().toISOString(), reason, data: snapshot}));
    return true
  } catch{
    return false
  }
}

function activeProducts() {

}

function productById(id) {

}

function pruneArchives() {
  const cut = new Date();
  cut.setHours(0, 0, 0, 0);
  cut.setDate(cut.getDate() - RETENTION_DAYS);
  db.archives = (db.archives || []).filter(a => {
    const d = new Date(a.date + 'T12:00:00');
    return Number.isFinite(d.getTime()) && d >= cut
  })
}

function dayHasData(day = db.day) {
  if (!day) return false;
  if (Object.keys(day.counts || {}).length) return true;
  if (Object.keys(day.delivery || {}).length || Object.keys(day.withdrawal || {}).length) return true;
  const h = day.movementHistory || {};
  return ['delivery', 'withdrawal'].some(k => Object.values(h[k] || {}).some(list => Array.isArray(list) && list.length > 0))
}

function prepareNewCalendarDay() {
  if (!db.day) db.day = newDay();
  if (db.day.date === today()) return false;
  if (dayHasData(db.day)) return false;
  db.day = newDay(today());
  save();
  return true
}

/* =========================
   RÈGLES MÉTIER
   ========================= */
function movementList(kind, id) {
  const box = db.day.movementHistory[kind];
  if (!Array.isArray(box[id])) {
    const legacy = number(db.day[kind]?.[id]);
    box[id] = legacy > 0 ? [{id: 'legacy-' + kind + '-' + id, value: legacy, ts: Date.now(), legacy: true}] : []
  }
  return box[id]
}

function movementTotal(kind, id) {
  return movementList(kind, id).reduce((s, m) => s + number(m.value), 0)
}

function syncMovement(kind, id) {
  const total = movementTotal(kind, id);
  if (total > 0) db.day[kind][id] = total; else delete db.day[kind][id]
}

function postSalesTotal(day, id) {
  return (day.postSales?.[id] || []).reduce((n, v) => n + number(v.value), 0)
}

function postMovementTotal(day, kind, id) {
  return (day.postMovement?.[kind]?.[id] || []).reduce((n, v) => n + number(v.value), 0)
}

function stockState(p, day = db.day) {
  const previous = number(p.prev), delivery = number(day.delivery?.[p.id]), withdrawal = number(day.withdrawal?.[p.id]), available = previous + delivery - withdrawal;
  const raw = day.counts?.[p.id], counted = (raw === undefined || raw === null || String(raw).trim() === '') ? null : number(raw);
  const phase = day.serviceFinished === true, postSold = phase ? postSalesTotal(day, p.id) : 0;
  // Chaque article garde les totaux des mouvements au moment de son premier comptage.
  // Les livraisons antérieures sont déjà incluses dans le comptage physique.
  // Pour les anciens essais sans repère, conserver leur calcul historique.
  const saved = day.countBaseline?.[p.id];
  const baseAdd = saved ? number(saved.delivery) : delivery - (phase ? postMovementTotal(day, 'delivery', p.id) : 0);
  const baseRemove = saved ? number(saved.withdrawal) : withdrawal - (phase ? postMovementTotal(day, 'withdrawal', p.id) : 0);
  const postAdd = delivery - baseAdd, postRemove = withdrawal - baseRemove;
  const sold = counted === null ? null : previous + baseAdd - baseRemove - counted + postSold;
  const current = counted === null ? null : counted + postAdd - postRemove - postSold;
  return {previous, delivery, withdrawal, available, counted, sold, current, postAdd, postRemove, postSold, surplus: sold !== null && sold < 0};
}

function pumpState(p, day = db.day) {
  const raw = day.counts?.[p.id];
  if (raw === undefined || raw === null || String(raw).trim() === '') return {status: 'empty', sold: null};
  const current = number(raw), previous = number(p.prev), sold = current - previous;
  return sold < 0 ? {status: 'lower', current, previous, sold: null} : {status: 'ok', current, previous, sold}
}

function soldValue(p, day = db.day) {
  return p.type === 'pump' ? pumpState(p, day).sold : stockState(p, day).sold
}

// Somme des quantités vendues positives (les surplus et les cases vides sont ignorés).
function sumPositiveSold(products) {
  return products.reduce((sum, p) => {
    const n = soldValue(p);
    return sum + (Number.isFinite(n) && n > 0 ? n : 0)
  }, 0)
}

function activeStocks() {
  return db.products.filter(p => p.active !== false && p.type !== 'pump')
}

function positiveSoldForCategory(cat) {
  return sumPositiveSold(activeStocks().filter(p => p.category === cat))
}

function closeIssues() {
  const issues = [];
  activeProducts().forEach((p, i) => {
    const raw = db.day.counts[p.id];
    if (raw === undefined || raw === null || String(raw).trim() === '') {
      issues.push({kind: 'empty', id: p.id, line: i + 1, name: p.name, text: p.type === 'pump' ? 'nouvel index non saisi' : 'nouveau stock non saisi'});
      return
    }
    if (p.type === 'pump') {
      if (pumpState(p).status === 'lower') issues.push({kind: 'warning', id: p.id, line: i + 1, name: p.name, text: 'index inférieur à l’ancien index'})
    } else {
      const st = stockState(p);
      if (st.surplus) issues.push({kind: 'warning', id: p.id, line: i + 1, name: p.name, text: `stock compté ${st.counted} supérieur au disponible ${st.available} (+${Math.abs(st.sold)})`})
    }
  });
  return issues
}

function genericDialog({title, text = '', html = '', okText = 'OK', cancelText = 'Annuler', danger = false, cancel = true}) {
  return new Promise(resolve => {
    const d = $('#genericDialog');
    d.innerHTML = [
      `<h2>${esc(title)}</h2>`,
      text ? `<p>${esc(text)}</p>` : '',
      html,
      '<div class="dialog-actions">',
      cancel ? `<button class="btn" data-answer="cancel">${esc(cancelText)}</button>` : '',
      `<button class="btn ${danger ? 'danger' : 'primary'}" data-answer="ok">${esc(okText)}</button>`,
      '</div>'
    ].join('');
    const overlay = $('#genericOverlay');
    openOverlay(overlay);
    d.onkeydown = e => {
      if (e.key === 'Enter' && e.target.matches('[data-numpad]')) {
        e.preventDefault();
        d.querySelector('[data-answer="ok"]')?.click()
      }
    };
    const firstNum = d.querySelector('[data-numpad]');

    const handler = e => {
      const b = e.target.closest('[data-answer]');
      if (!b) return;
      overlay.removeEventListener('click', handler);
      closeOverlay(overlay);
      resolve(b.dataset.answer === 'ok')
    };
    overlay.addEventListener('click', handler)
  })
}

   INVENTAIRE / RENDU
   ========================= */
// Le contenu est enveloppé dans une « pastille » en relief (avec un badge ±) pour montrer qu'on peut toucher ici
// afin d'ajouter une livraison ou un retrait.
function beforeHtml(p) {
  return `<span class="before-chip"><button type="button" class="movement-btn" data-movement="${esc(p.id)}" title="Ajouter ou retirer du stock" aria-label="Ajouter ou retirer du stock pour ${esc(p.name)}"></button>${beforeContent(p)}</span>`
}

function beforeContent(p) {
  const s = stockState(p);
  if (!s.delivery && !s.withdrawal) return `<span class="before-base">${compact(s.previous)}</span>`;
  // Le calcul (petit, discret) est au-dessus ; le total (la réponse) est mis en avant en dessous.
  const add = s.delivery ? ` <span class="move-add">+${compact(s.delivery)}</span>` : '';
  const remove = s.withdrawal ? ` <span class="move-remove">−${compact(s.withdrawal)}</span>` : '';
  return `<span class="before-calc"><span class="calc-detail">(${compact(s.previous)}${add}${remove})</span><span class="calc-total">${compact(s.available)}</span></span>`
}

function soldHtml(p) {
  const s = stockState(p);
  if (s.counted === null) return '—';
  return s.surplus ? '+' + compact(Math.abs(s.sold)) : compact(s.sold)
}

function fuelKind(name) {
  const n = name.toLowerCase();
  return n.includes('diesel') || n.includes('camion') ? 'diesel' : n.includes('95') ? '95' : '98'
}

function fuelClass(name) {
  return 'fuel-' + fuelKind(name)
}

function fuelBadge(name) {
  return {diesel: 'DIESEL', 95: 'SP95', 98: 'SP98'}[fuelKind(name)]
}

function stockRowHtml(p) {
  const st = stockState(p), value = db.day.counts[p.id] ?? '';
  const stockCell = db.day.serviceFinished
    ? `<button type="button" class="current-stock-button" data-post-current="${esc(p.id)}" aria-label="Enregistrer une vente après inventaire pour ${esc(p.name)}"><strong>${st.current === null ? '—' : compact(st.current)}</strong></button>`
    : `<input class="count-input" data-count="${esc(p.id)}" data-numpad="count" type="text" inputmode="none" enterkeyhint="next" autocomplete="off" value="${esc(value)}">`;
  return [
    `<div class="sheet-row ${p.id === activeProductId ? 'active' : ''} ${st.surplus ? 'warning' : ''}" data-product-row="${esc(p.id)}">`,
    `<div class="cell name-cell"><span class="warn">${st.surplus ? '⚠' : ''}</span><strong>${esc(p.name)}</strong></div>`,
    `<div class="cell before-cell" data-movement="${esc(p.id)}">${beforeHtml(p)}</div>`,
    `<div class="cell">${stockCell}</div>`,
    `<div class="cell sold-cell ${st.surplus ? 'surplus' : ''}">${soldHtml(p)}</div>`,
    '</div>'
  ].join('')
}

function stockSheetHtml(stocks) {
  const columns = ['ARTICLE', 'AVANT', db.day.serviceFinished ? 'STOCK ACTUEL' : 'COMPTÉ', 'VENDU'];
  return `<div class="sheet"><div class="sheet-head">${columns.map(c => `<span>${c}</span>`).join('')}</div>${stocks.map(stockRowHtml).join('')}</div>`
}

// Ordre d'affichage des carburants : pompes impaires = diesel, 98, 95 ; pompes paires = 95, 98, diesel.
function fuelRank(pumpNumber, name) {
  const l = name.toLowerCase(), diesel = l.includes('diesel'), sp98 = l.includes('98'), sp95 = l.includes('95');
  return pumpNumber % 2 === 1 ? (diesel ? 0 : sp98 ? 1 : sp95 ? 2 : 3) : (sp95 ? 0 : sp98 ? 1 : diesel ? 2 : 3)
}

function pumpFuelHtml(p) {
  return [
    `<div class="pump-fuel ${fuelClass(p.name)}">`,
    `<span class="fuel-badge">⛽ ${fuelBadge(p.name)}${p.name === 'P Camion' ? ' <small>CAMION</small>' : ''}</span>`,
    '<div class="pump-entry">',
    `<span class="pump-old">Ancien index <strong>${compact(p.prev)}</strong></span>`,
    `<input aria-label="Nouvel index ${esc(p.name)}" class="count-input pump-input" data-count="${esc(p.id)}" data-numpad="count" type="text" inputmode="none" enterkeyhint="next" autocomplete="off" value="${esc(db.day.counts[p.id] ?? '')}">`,
    `<span class="pump-meta">${pumpMetaHtml(p)}</span>`,
    '</div></div>'
  ].join('')
}

function pumpGroupHtml(title, items) {
  const done = items.filter(p => String(db.day.counts[p.id] ?? '').trim() !== '').length;
  return [
    `<div class="pump-group"><div class="pump-head"><span>${esc(title)}</span>`,
    `<span class="pump-status ${done === items.length ? 'complete' : ''}">${pumpStatusText(done, items.length)}</span></div>`,
    `<div class="pump-body">${items.map(pumpFuelHtml).join('')}</div></div>`
  ].join('')
}

function pumpSectionHtml(pumps) {
  const groups = [1, 2, 3, 4].map(n => ({n, items: pumps.filter(p => p.name.startsWith('P' + n + ' '))})).filter(g => g.items.length);
  groups.forEach(g => g.items.sort((a, b) => fuelRank(g.n, a.name) - fuelRank(g.n, b.name)));
  const truck = pumps.find(p => p.name === 'P Camion');
  return `<div class="pump-section"><h3>Pompes carburant</h3>${groups.map(g => pumpGroupHtml('Pompe ' + g.n, g.items)).join('')}${truck ? pumpGroupHtml('P Camion', [truck]) : ''}</div>`
}

function renderInventory() {
  const act = activeProducts();
  const stocks = act.filter(p => p.type !== 'pump' && (!categoryFilter || p.category === categoryFilter));
  const pumps = categoryFilter ? [] : act.filter(p => p.type === 'pump');
  if (!stocks.some(p => p.id === activeProductId)) activeProductId = stocks[0]?.id || null;
  let html = '';
  if (stocks.length) html += stockSheetHtml(stocks);
  else if (categoryFilter) html += `<div class="empty">Aucun article dans « ${esc(categoryFilter)} ».</div>`;
  if (pumps.length) html += pumpSectionHtml(pumps);
  $('#inventoryContent').innerHTML = html;
  renderSummary();
  numpadSync();
}

function renderSummary() {
  const isPellet = p => String(p.category || '').trim().toLowerCase() === 'pellets' || String(p.name || '').trim().toLowerCase().startsWith('pellet ');
  const pellets = sumPositiveSold(activeStocks().filter(isPellet)) / 65;
  $('#pelletSummary').textContent = `${compact(pellets)} palette${pellets === 1 ? '' : 's'}`;
  $('#gasSummary').textContent = `${compact(positiveSoldForCategory('Gaz'))} pcs`
}

function renderCategories() {
  const cats = [...new Set(db.categories.filter(Boolean))];
  if (!cats.includes('Autres')) cats.push('Autres');
  const menu = $('#categoryMenu');
  menu.innerHTML = `<button data-category="" class="${!categoryFilter?'active':''}">Tous</button>` + cats.map(c => `<button data-category="${esc(c)}" class="${categoryFilter===c?'active':''}">${esc(c)}</button>`).join('');
  $('#newProductCategory').innerHTML = cats.map(c => `<option>${esc(c)}</option>`).join('')
}

/* =========================
   SAISIE / NAVIGATION TABLETTE
   ========================= */
function saveCountInput(input) {
  const id = input.dataset.count, p = productById(id);
  if (!p || db.day.serviceFinished && p.type !== 'pump') return;
  const digits = String(input.value || '').replace(/[^0-9]/g, '');
  if (input.value !== digits) input.value = digits;
  if (digits === '') {
    delete db.day.counts[id];
    delete db.day.countBaseline[id];
    delete db.day.countMovementIds[id]
  }
  else {
    // Premier comptage : mémoriser les livraisons/retraits déjà enregistrés.
    if (p.type !== 'pump' && !db.day.countBaseline[id]) {
      db.day.countBaseline[id] = {delivery: number(db.day.delivery[id]), withdrawal: number(db.day.withdrawal[id])};
      db.day.countMovementIds[id] = {delivery: movementList('delivery', id).map(m => m.id), withdrawal: movementList('withdrawal', id).map(m => m.id)};
    }
    db.day.counts[id] = Number(digits);
  }
  activeProductId = id;
  save()
}

function highlightActiveRow() {
  $$('.sheet-row').forEach(r => r.classList.toggle('active', r.dataset.productRow === activeProductId))
}

function activateCountInput(input, {select = true, scroll = false} = {}) {
  if (!input) return;
  if (db.day.serviceFinished && productById(input.dataset.count)?.type !== 'pump') {
    openPostSale(input.dataset.count);
    return;
  }
  activeProductId = input.dataset.count || null;
  highlightActiveRow();
  input.focus({preventScroll: true});
  if (select) input.select();
  if (scroll) input.scrollIntoView({block: 'center', behavior: 'smooth'})
}
const pumpStatusText = (done, total) => `${done}/${total} ${total===1?'saisi':'saisis'}`;

function pumpMetaHtml(p) {
  const st = pumpState(p);
  return st.status === 'lower' ? '<span class="bad">⚠ Index inférieur</span>' : `Vendu <strong>${st.status==='ok'?compact(st.sold):'—'} L</strong>`
}

function refreshCountDisplay(id) {
  const p = productById(id);
  if (!p) return;
  if (p.type === 'pump') {
    const input = $(`[data-count="${CSS.escape(id)}"]`), meta = input?.closest('.pump-fuel')?.querySelector('.pump-meta');
    if (meta) meta.innerHTML = pumpMetaHtml(p);
    const group = input?.closest('.pump-group');
    if (group) {
      const all = [...group.querySelectorAll('[data-count]')], done = all.filter(x => String(x.value || '').trim() !== '').length, status = group.querySelector('.pump-status');
      if (status) {
        status.textContent = pumpStatusText(done, all.length);
        status.classList.toggle('complete', done === all.length)
      }
    }
  } else {
    const row = $(`[data-product-row="${CSS.escape(id)}"]`), s = stockState(p);
    if (row) {
      row.classList.toggle('warning', s.surplus);
      const sold = row.querySelector('.sold-cell'), warn = row.querySelector('.warn');
      if (sold) {
        sold.innerHTML = soldHtml(p);
        sold.classList.toggle('surplus', s.surplus)
      }
      if (warn) warn.textContent = s.surplus ? '⚠' : ''
    }
  }
  renderSummary();
}

function commitCount(input) {
  saveCountInput(input);
  refreshCountDisplay(input.dataset.count)
}

function nextCountInput(current) {
  const inputs = $$('[data-count]');
  const i = inputs.indexOf(current);
  return inputs[i + 1] || null
}

function handleCountKeydown(e) {
  if (db.day.serviceFinished && productById(e.target.dataset.count)?.type !== 'pump') {
    if (e.key === 'Enter') {
      e.preventDefault();
      openPostSale(e.target.dataset.count)
    }
    return;
  }
  if (e.key !== 'Enter' && e.keyCode !== 13) return;
  e.preventDefault();
  const current = e.target;
  commitCount(current);
  const next = nextCountInput(current);
  if (next) {
    activateCountInput(next, {select: true, scroll: true})
  } else current.blur()
}

const timeLabel = ts => new Date(ts || Date.now()).toLocaleTimeString('fr-BE', {hour: '2-digit', minute: '2-digit'});

function movementItemHtml(m) {
  const key = `${m.kind}|${esc(m.id)}`;
  return `<div class="movement-item ${m.kind === 'delivery' ? 'add' : 'remove'}"><span>${m.kind === 'delivery' ? '+' : '−'}${compact(m.value)} <small>${timeLabel(m.ts)}</small></span><button class="btn small" data-edit-movement="${key}">Modifier</button><button class="btn small" data-delete-movement="${key}">Supprimer</button></div>`
}

function movementStockInfo(st) {
  if (db.day.serviceFinished) return `Stock actuel ${compact(st.current)} · Compté ${compact(st.counted)}`;
  if (st.counted !== null) return `Compté ${compact(st.counted)} · Stock réel ${compact(st.current)} · Disponible ${compact(st.available)}`;
  return `Stock matin ${compact(st.previous)} · Disponible ${compact(st.available)}`
}

function renderMovementDialog() {
  const p = productById(movementContext.id);
  if (!p) return;
  $('#movementStockInfo').textContent = movementStockInfo(stockState(p));
  for (const [kind, target] of [['withdrawal', '#movementRemoveHistory'], ['delivery', '#movementAddHistory']]) {
    const items = movementList(kind, p.id).map(m => ({...m, kind})).sort((a,b) => number(b.ts)-number(a.ts));
    $(target).innerHTML = items.length ? items.map(movementItemHtml).join('') : '<div style="padding:9px;color:#78888f">Aucun mouvement</div>';
  }
}

function saveMovement(kind) {
  const id = movementContext.id;
  const input = kind === 'delivery' ? $('#movementAddQty') : $('#movementRemoveQty');
  const value = number(input.value);
  if (value <= 0) { input.focus(); return; }
  const list = movementList(kind, id);
  const m = {id: 'm' + Date.now() + Math.random().toString(36).slice(2, 6), value, ts: Date.now()};
  list.push(m);
  if (db.day.serviceFinished) {
    const box = db.day.postMovement[kind];
    (box[id] || (box[id] = [])).push({...m});
  } else if (db.day.countBaseline?.[id]) {
    db.day.countBaseline[id][kind] = number(db.day.countBaseline[id][kind]) + value;
    const ids = db.day.countMovementIds[id] || (db.day.countMovementIds[id] = {delivery: [], withdrawal: []});
    (ids[kind] || (ids[kind] = [])).push(m.id);
  }
  syncMovement(kind, id);
  save();
  input.value = '';
  renderInventory();
  renderMovementDialog();
  closeNumpad();
  toast(kind === 'delivery' ? `✓ Ajout de ${value}` : `✓ Retrait de ${value}`);
}
// Corriger un mouvement historique ne doit pas modifier un comptage physique déjà réalisé.
// Un mouvement postérieur au comptage, lui, doit modifier le stock réel.
function isMovementBeforeCount(kind, productId, movementId) {
  const snapshot = db.day.countMovementIds?.[productId]?.[kind];
  if (Array.isArray(snapshot)) return snapshot.includes(movementId);
  // Données des versions précédentes : après validation, seuls les mouvements
  // enregistrés dans postMovement sont des mouvements postérieurs.
  if (db.day.serviceFinished) return !(db.day.postMovement?.[kind]?.[productId] || []).some(m => m.id === movementId);
  // Sans historique individuel antérieur, ne pas inventer une date de comptage.
  return false;
}

function correctCountBaseline(kind, productId, movementId, delta) {
  if (!db.day.countBaseline?.[productId] || !isMovementBeforeCount(kind, productId, movementId)) return;
  const baseline = db.day.countBaseline[productId];
  baseline[kind] = Math.max(0, number(baseline[kind]) + delta);
}

async function editMovement(token) {
  const [kind, id] = token.split('|'), p = productById(movementContext.id), m = movementList(kind, p.id).find(x => x.id === id);
  if (!m) return;
  const html = `<input id="editMovementValue" data-numpad="dialog" inputmode="none" value="${esc(m.value)}">`;
  const ok = await genericDialog({title: 'Modifier le mouvement', html, okText: 'Enregistrer'});
  if (!ok) return;
  const v = number($('#editMovementValue')?.value);
  if (v <= 0) return;
  const delta = v - number(m.value);
  correctCountBaseline(kind, p.id, id, delta);
  m.value = v;
  const pm = (db.day.postMovement[kind][p.id] || []).find(x => x.id === id);
  if (pm) pm.value = v;
  syncMovement(kind, p.id);
  save();
  renderMovementDialog();
  renderInventory()
}

async function deleteMovement(token) {
  const [kind, id] = token.split('|'), p = productById(movementContext.id);
  if (!p) return;
  const list = movementList(kind, p.id), i = list.findIndex(x => x.id === id);
  if (i < 0) return;
  const ok = await genericDialog({title: 'Supprimer ce mouvement ?', text: 'Le stock AVANT sera corrigé. Le stock ACTUEL compté restera inchangé si ce mouvement date d’avant son comptage.', okText: 'Supprimer', danger: true});
  if (!ok) return;
  correctCountBaseline(kind, p.id, id, -number(list[i].value));
  list.splice(i, 1);
  const post = db.day.postMovement[kind][p.id] || [];
  const j = post.findIndex(x => x.id === id);
  if (j >= 0) post.splice(j, 1);
  syncMovement(kind, p.id);
  save();
  renderMovementDialog();
  renderInventory()
}

let postSaleId = null;

async function finishInventory() {
  if (db.day.serviceFinished) return;
  const missing = activeProducts().filter(p => p.type !== 'pump' && String(db.day.counts[p.id] ?? '').trim() === '');
  if (missing.length) {
    await genericDialog({title: 'Comptage incomplet', text: `${missing.length} article(s) sans stock compté. Terminez le comptage avant de valider.`, cancel: false});
    return
  }
  const ok = await genericDialog({title: 'Valider le comptage ?', text: 'Les stocks comptés seront protégés. Les ventes suivantes et les livraisons/retraits mettront à jour le stock actuel. Les index des pompes restent saisissables.', okText: 'Confirmer'});
  if (!ok) return;
  db.day.serviceFinished = true;
  db.day.serviceFinishedAt = new Date().toISOString();
  db.day.postSales = {};
  db.day.postMovement = {delivery: {}, withdrawal: {}};
  save();
  renderInventory();
  updateFinishButton();
  toast('✓ Comptage validé — ventes possibles')
}

async function reopenInventory() {
  if (!db.day.serviceFinished) return;
  const postSales = Object.values(db.day.postSales || {}).some(a => a?.length), postMoves = ['delivery', 'withdrawal'].some(k => Object.values(db.day.postMovement?.[k] || {}).some(a => a?.length));
  if (postSales || postMoves) {
    await genericDialog({title: 'Retour au comptage indisponible', text: 'Des ventes ou mouvements ont déjà été enregistrés après l’inventaire. Pour éviter de fausser les stocks, terminez la journée ou restaurez une sauvegarde précédente.', cancel: false});
    return
  }
  const ok = await genericDialog({title: 'Revenir au comptage ?', text: 'Les cases COMPTÉ redeviendront modifiables.', okText: 'Revenir au comptage'});
  if (!ok) return;
  db.day.serviceFinished = false;
  db.day.serviceFinishedAt = null;
  save();
  renderInventory();
  updateFinishButton()
}

function updateFinishButton() {
  const b = $('#finishInventoryButton');
  b.textContent = '✓ Valider le comptage';
  b.classList.toggle('primary', !db.day.serviceFinished);
  b.style.display = db.day.serviceFinished ? 'none' : '';
  const r = $('#reopenAdminButton');
  if (r) r.style.display = db.day.serviceFinished ? '' : 'none'
}

function openPostSale(id) {
  if (!db.day.serviceFinished) return;
  const p = productById(id);
  if (!p || p.type === 'pump') return;
  postSaleId = id;
  $('#postSaleTitle').textContent = 'Vente — ' + p.name;
  $('#postSaleQty').value = '';
  renderPostSale();
  openOverlay($('#postSaleOverlay'));
  setTimeout(() => $('#postSaleQty').focus(), 30)
}

function renderPostSale() {
  const p = productById(postSaleId);
  if (!p) return;
  const sales = db.day.postSales[p.id] || [];
  const saleHtml = v => `<div class="movement-item remove"><span>−${compact(v.value)} <small>${timeLabel(v.ts)}</small></span><button class="btn small" data-cancel-post-sale="${esc(v.id)}">Annuler la vente</button></div>`;
  $('#postSaleHistory').innerHTML = sales.length ? '<div class="movement-history-title">Ventes enregistrées — annuler si erreur</div>' + sales.map(saleHtml).join('') : ''
}

function savePostSale() {
  const p = productById(postSaleId);
  if (!p || !db.day.serviceFinished) return;
  const raw = $('#postSaleQty').value.trim();
  const n = Number(raw), s = stockState(p);
  if (!/^\d+$/.test(raw) || !Number.isSafeInteger(n) || n <= 0 || n > s.current) {
    toast('Quantité invalide ou supérieure au stock actuel');
    return
  }
  const sales = db.day.postSales[p.id] || (db.day.postSales[p.id] = []);
  sales.push({id: 's' + Date.now() + Math.random().toString(36).slice(2, 6), value: n, ts: Date.now()});
  save();
  closeOverlay($('#postSaleOverlay'));
  renderInventory();
  toast(`✓ Vente de ${n} — stock actuel : ${compact(stockState(p).current)}`)
}

async function cancelPostSale(id) {
  const p = productById(postSaleId);
  if (!p) return;
  const sales = db.day.postSales[p.id] || [], v = sales.find(x => x.id === id);
  if (!v) return;
  const ok = await genericDialog({title: 'Annuler cette vente ?', text: `Rétablir ${compact(v.value)} unité(s) dans le stock actuel ?`, okText: 'Annuler la vente'});
  if (!ok) return;
  db.day.postSales[p.id] = sales.filter(x => x.id !== id);
  save();
  renderPostSale();
  renderInventory()
}

/* =========================
   PAVÉ NUMÉRIQUE + CALCUL
   ========================= */
function calculateExpression(expr) {
  if (!expr || !/^[0-9+\-*/().\s]+$/.test(expr)) return null;
  try {
    const r = Function('"use strict";return (' + expr + ')')();
    return typeof r === 'number' && Number.isFinite(r) ? r : null
  } catch{
    return null
  }
}
const np = {el: null, target: null, expr: '', fresh: true, open: false};
const NP_OPS = '+-*/';
const hasOperator = s => /[+\-*/]/.test(s);

function buildNumpad() {
  np.el = $('#numpad');
  const layout = ['7', '8', '9', '/', '4', '5', '6', '*', '1', '2', '3', '-', 'C', '0', '⌫', '+'];
  const label = k => k === '/' ? '÷' : k === '*' ? '×' : k === '-' ? '−' : k;
  const cls = k => NP_OPS.includes(k) ? 'operator' : k === 'C' ? 'clear' : k === '⌫' ? 'backspace' : '';
  $('#numpadGrid').innerHTML = layout.map(k => `<button type="button" class="${cls(k)}" data-np-key="${k}">${label(k)}</button>`).join('') + '<button type="button" class="equals" data-np-key="=">=</button><button type="button" class="enter" id="numpadEnter" data-np-key="enter">OK</button>';
}

function numpadLabel(t) {
  if (!t) return '';
  const row = t.closest('[data-product-row]');
  if (row) return row.querySelector('strong')?.textContent || '';
  const dlg = t.closest('.dialog');
  if (dlg) return dlg.querySelector('h2')?.textContent || '';
  const prev = t.previousElementSibling;
  if (prev && prev.tagName === 'LABEL') return prev.textContent;
  return t.getAttribute('aria-label') || ''
}

function syncNumpadHeight() {
  document.documentElement.style.setProperty('--numpad-h', np.open && np.el ? np.el.offsetHeight + 'px' : '0px')
}

function numpadRender() {
  if (!np.open) return;
  const disp = s => s.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
  $('#numpadExpr').textContent = disp(np.expr) || '0';
  const r = hasOperator(np.expr) ? calculateExpression(np.expr) : null;
  $('#numpadResult').textContent = r !== null ? '= ' + compact(Math.max(0, Math.round(r))) : '';
  $('#numpadLabel').textContent = numpadLabel(np.target);
  $('#numpadEnter').textContent = np.target?.dataset.numpad === 'count' ? 'Suivant ›' : 'OK';
}

function numpadReveal(el) {
  if (!np.open || !el || !document.contains(el) || el.closest('.overlay')) return;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const limit = vh - np.el.offsetHeight - 10, r = el.getBoundingClientRect();
  const top = (document.querySelector('.header')?.offsetHeight || 0) + ($('#categoryMenu')?.offsetHeight || 0);
  if (r.bottom > limit) window.scrollBy({top: r.bottom - limit + 12, behavior: 'smooth'});
  else if (r.top < top + 6) window.scrollBy({top: r.top - top - 12, behavior: 'smooth'});
}

function openNumpad(input) {
  if (!input || input.disabled || input.readOnly || !np.el) return;
  const same = np.open && np.target === input;
  np.target = input;
  if (!same) {
    np.expr = String(input.value || '').replace(/[^0-9]/g, '');
    np.fresh = true
  }
  np.open = true;
  np.el.classList.add('open');
  np.el.setAttribute('aria-hidden', 'false');
  document.body.classList.add('numpad-open');
  syncNumpadHeight();
  numpadRender();
  setTimeout(() => {
    syncNumpadHeight();
    numpadReveal(input)
  }, 150);
}

function closeNumpad() {
  if (!np.el || !np.open) return;
  np.open = false;
  np.target = null;
  np.el.classList.remove('open');
  np.el.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('numpad-open');
  syncNumpadHeight();
}

function numpadSync() {
  if (np.open && (!np.target || !document.contains(np.target))) closeNumpad()
}

function numpadWrite() {
  const t = np.target;
  if (!t) return;
  let out = null;
  if (!np.expr) out = '';
  else if (!hasOperator(np.expr)) out = String(Number(np.expr));
  else {
    const r = calculateExpression(np.expr);
    if (r !== null) out = String(Math.max(0, Math.round(r)))
  }
  if (out === null || t.value === out) return;
  t.value = out;
  t.dispatchEvent(new Event('input', {bubbles: true}));
}

function numpadResolve() {
  np.expr = np.expr.replace(/[+\-*/]+$/, '');
  if (!hasOperator(np.expr)) return true;
  const r = calculateExpression(np.expr);
  if (r === null) {
    toast('Calcul incomplet ou invalide');
    return false
  }
  np.expr = String(Math.max(0, Math.round(r)));
  return true;
}

function numpadEnter() {
  const t = np.target;
  if (!t) return;
  if (!numpadResolve()) return;
  np.fresh = false;
  numpadWrite();
  numpadRender();
  const mode = t.dataset.numpad;
  if (mode === 'init') {
    const all = $$('[data-numpad="init"]'), n = all[all.indexOf(t) + 1];
    if (n) {
      n.focus();
      n.select?.()
    } else closeNumpad();
    return
  }
  t.dispatchEvent(new KeyboardEvent('keydown', {key: 'Enter', keyCode: 13, bubbles: true, cancelable: true}));
  if (mode === 'count' && np.target === t) closeNumpad();
}

function numpadKey(k) {
  if (!np.open || !np.target) return;
  if (k === 'close') {
    closeNumpad();
    return
  }
  if (k === 'enter') {
    numpadEnter();
    return
  }
  if (k === 'C') {
    np.expr = '';
    np.fresh = false
  }
  else if (k === '⌫') {
    np.expr = np.expr.slice(0, -1);
    np.fresh = false
  }
  else if (k === '=') {
    if (numpadResolve()) np.fresh = false
  }
  else if (NP_OPS.includes(k)) {
    if (!np.expr) return;
    np.expr = NP_OPS.includes(np.expr.slice(-1)) ? np.expr.slice(0, -1) + k : np.expr + k;
    np.fresh = false;
  } else {
    if (np.fresh) {
      np.expr = '';
      np.fresh = false
    }
    if (np.expr.length > 40) return;
    np.expr = np.expr.replace(/(^|[+\-*/])0$/, '$1') + k;
  }
  numpadWrite();
  numpadRender();
}
buildNumpad();
document.addEventListener('focusin', e => {
  const t = e.target;
  if (!(t instanceof HTMLInputElement)) return;
  if (t.matches('[data-numpad]')) openNumpad(t); else if (!t.closest('#numpad')) closeNumpad()
});
document.addEventListener('click', e => {
  const t = e.target.closest?.('[data-numpad]');
  if (t && (!np.open || np.target !== t)) openNumpad(t)
});
document.addEventListener('input', e => {
  if (e.isTrusted && np.open && e.target === np.target) {
    np.expr = String(e.target.value).replace(/[^0-9]/g, '');
    np.fresh = false;
    numpadRender()
  }
});
$('#numpad').addEventListener('mousedown', e => e.preventDefault());
$('#numpad').addEventListener('click', e => {
  const b = e.target.closest('[data-np-key]');
  if (b) numpadKey(b.dataset.npKey)
});
window.addEventListener('resize', () => {
  if (np.open) syncNumpadHeight()
});

/* =========================
   CLÔTURE / HISTORIQUE
   ========================= */
function archiveDay(reason = 'manual') {
  db.archives = db.archives || [];
  const snap = {date: db.day.date, createdAt: new Date().toISOString(), reason, data: clone(db.day), products: clone(db.products)};
  const i = db.archives.findIndex(a => a.date === snap.date);
  if (i >= 0) db.archives[i] = snap; else db.archives.push(snap);
  pruneArchives()
}

async function requestCloseDay() {
  const issues = closeIssues();
  const empties = issues.filter(i => i.kind === 'empty');
  const list = `<div class="close-issues">${issues.map(i => `<div class="issue"><b>Ligne ${i.line} — ${esc(i.name)}</b><br>${esc(i.text)}</div>`).join('')}</div>`;
  if (empties.length) {
    await genericDialog({title: 'Comptage incomplet', text: `${empties.length} case${empties.length>1?'s':''} obligatoire${empties.length>1?'s':''} ${empties.length>1?'sont':'est'} vide.`, html: list, cancel: false, okText: 'Compléter'});
    const first = empties[0];
    const input = $(`[data-count="${CSS.escape(first.id)}"]`);
    input?.scrollIntoView({behavior: 'smooth', block: 'center'});
    activateCountInput(input, {select: true});
    return
  }
  const ok = await genericDialog({title: issues.length ? 'Anomalies détectées' : 'Terminer la journée ?', text: issues.length ? 'Vous pouvez corriger ou continuer quand même.' : 'Les stocks comptés deviendront les stocks AVANT de la nouvelle journée.', html: issues.length ? list : '', okText: issues.length ? 'Continuer quand même' : 'Terminer et imprimer'});
  if (ok) closeDayNow()
}

function closeDayNow({reason = 'closure', download = true, print = true} = {}) {
  const before = clone(db), closed = clone(db.day), productSnapshot = clone(db.products);
  saveRecovery(before, 'avant-cloture');
  try {
    archiveDay(reason);
    activeProducts().forEach(p => {
      if (!Object.prototype.hasOwnProperty.call(closed.counts || {}, p.id)) return;
      const raw = closed.counts[p.id];
      if (raw === undefined || raw === null || String(raw).trim() === '') return;
      const n = Number(raw);
      if (!Number.isFinite(n)) return;
      p.prev = p.type === 'pump' ? n : Math.max(0, stockState(p, closed).current)
    });
    db.day = newDay(today());
    save();
  } catch (e) {
    db = before;
    try {
      save()
    } catch{}
    ;
    genericDialog({title: 'Clôture impossible', text: 'Les données ont été conservées. Aucune valeur n’a été perdue.', cancel: false});
    return false
  }
  let sideEffectWarning = false;
  if (download) {
    try {
      downloadBackup('inventaire-v200-cloture')
    } catch{
      sideEffectWarning = true
    }
  }
  if (print) {
    try {
      printSnapshot({date: closed.date, data: closed, products: productSnapshot})
    } catch{
      sideEffectWarning = true
    }
  }
  renderAll();
  toast(sideEffectWarning ? 'Journée terminée — vérifiez sauvegarde / impression' : 'Journée terminée — demain est prêt');
  return true
}

function historyRowHtml(a) {
  return `<div class="history-row"><b>${formatDate(a.date)}</b><span><button class="btn small" data-print-archive="${esc(a.date)}">Imprimer</button></span></div>`
}

function renderHistory() {
  pruneArchives();
  save();
  const list = [...(db.archives || [])].sort((a, b) => b.date.localeCompare(a.date));
  $('#historyList').innerHTML = list.length ? list.map(historyRowHtml).join('') : '<span style="color:#78888f">Aucun inventaire archivé.</span>'
}

/* =========================
   IMPRESSION
   ========================= */
const REPORT_PAGES = {
  stock: ['Article', 'Matin', 'Ajout', 'Retrait', 'Disponible', 'Stock actuel', 'Vendu'],
  fuel: ['Pompe', 'Carburant', 'Ancien index', 'Nouvel index', 'Litres'],
  truck: ['Pompe', 'Ancien index', 'Nouvel index', 'Litres']
};

const reportTable = (columns, rows, cls = '') => `<table${cls ? ` class="${cls}"` : ''}><thead><tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
const reportPage = (cls, title, day, table) => `<section class="print-page ${cls}"><h1>${title} — ${formatDate(day.date)}</h1>${table}</section>`;
const reportCells = cells => `<tr>${cells.map(c => `<td>${c}</td>`).join('')}</tr>`;

// Litres vendus d'une pompe : « ⚠ » si le nouvel index est inférieur à l'ancien.
function reportLiters(ps) {
  return ps.status === 'ok' ? compact(ps.sold) : ps.status === 'lower' ? '⚠' : ''
}

function reportHtml(day = db.day, products = db.products) {
  const all = products.filter(p => p.active !== false).sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
  const stockRows = all.filter(p => p.type !== 'pump').map(p => {
    const s = stockState(p, day);
    return reportCells([esc(p.name), compact(s.previous), compact(s.delivery), compact(s.withdrawal), compact(s.available), s.current === null ? '' : `<b>${compact(s.current)}</b>`, s.sold === null ? '' : compact(s.sold)])
  }).join('');
  const pumpRows = all.filter(p => p.type === 'pump' && p.name !== 'P Camion').map(p => {
    const ps = pumpState(p, day);
    return reportCells([esc(p.name.replace(/ Essence /, ' ').replace(' Diesel', '')), esc(fuelBadge(p.name)), compact(p.prev), ps.current === undefined ? '' : compact(ps.current), reportLiters(ps)])
  }).join('');
  const truck = all.find(p => p.name === 'P Camion');
  let truckPage = '';
  if (truck) {
    const ps = pumpState(truck, day);
    const row = reportCells(['P Camion', compact(truck.prev), ps.current === undefined ? '' : compact(ps.current), reportLiters(ps)]);
    truckPage = reportPage('truck-page', 'P Camion', day, reportTable(REPORT_PAGES.truck, row))
  }
  return reportPage('stock-page', 'Inventaire', day, reportTable(REPORT_PAGES.stock, stockRows, 'stock-table')) + reportPage('fuel-page', 'Carburants', day, reportTable(REPORT_PAGES.fuel, pumpRows)) + truckPage
}

let printingInProgress = false;
function printSnapshot(snapshot) {
  if (printingInProgress) return;
  printingInProgress = true;
  const day = snapshot.data || snapshot, products = snapshot.products || db.products;
  const frame = document.createElement('iframe');
  frame.setAttribute('aria-hidden', 'true');
  frame.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;pointer-events:none';
  let started = false;
  let finished = false;
  let fallbackTimer;
  const cleanup = () => {
    if (finished) return;
    finished = true;
    clearTimeout(fallbackTimer);
    frame.remove();
    printingInProgress = false;
  };
  const startPrint = () => {
    if (started || finished) return;
    started = true;
    try {
      const printWindow = frame.contentWindow;
      printWindow.addEventListener('afterprint', () => setTimeout(cleanup, 1500), {once: true});
      // Une seule demande d'impression ; le titre principal n'est jamais modifié.
      printWindow.focus();
      printWindow.print();
    } catch (error) {
      console.error('Impression impossible :', error);
      toast('Impression impossible sur ce navigateur');
      cleanup();
    }
  };
  frame.onload = () => setTimeout(startPrint, 400);
  document.body.appendChild(frame);
  try {
    const doc = frame.contentDocument;
    doc.open();
    doc.write(`<!doctype html><html><head><meta charset="utf-8"><title>Inventaire du ${esc(formatDate(day.date))}</title><style>${PRINT_CSS}</style></head><body>${reportHtml(day,products)}</body></html>`);
    doc.close();
    // Secours si l'événement load ne se déclenche pas sur certains navigateurs Android.
    setTimeout(startPrint, 2000);
    fallbackTimer = setTimeout(cleanup, 90000);
  } catch (error) {
    console.error('Préparation de l’impression impossible :', error);
    toast('Préparation de l’impression impossible');
    cleanup();
  }
}

function downloadBackup(prefix = 'inventaire-v200') {
  const now = new Date(), pad = n => String(n).padStart(2, '0');
  const stamp = `${localDateString(now)}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
  const payload = {...clone(db), exportVersion: APP_VERSION, exportedAt: now.toISOString()};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'}), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url;
  a.download = `${prefix}-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  return true
}

function moveProduct(id, delta) {
  const act = db.products.filter(p => p.active !== false && p.type !== 'pump').sort((a, b) => a.position - b.position), i = act.findIndex(p => p.id === id), j = i + delta;
  if (i < 0 || j < 0 || j >= act.length) return;
  const tmp = act[i].position;
  act[i].position = act[j].position;
  act[j].position = tmp;
  save();
  renderAdmin();
  renderInventory()
}

function reorderProduct(dragId, targetId, after = false) {
  if (!dragId || !targetId || dragId === targetId) return;
  const act = db.products.filter(p => p.active !== false && p.type !== 'pump').sort((a, b) => a.position - b.position);
  const from = act.findIndex(p => p.id === dragId);
  if (from < 0) return;
  const [item] = act.splice(from, 1);
  let to = act.findIndex(p => p.id === targetId);
  if (to < 0) return;
  if (after) to++;
  act.splice(to, 0, item);
  act.forEach((p, i) => p.position = i);
  save();
  renderAdmin();
  renderInventory();
  toast('✓ Produit déplacé')
}

  }).filter(Boolean).filter(x => number(x.p.prev) !== x.value);

  const hasDayData = Object.keys(db.day.counts || {}).length > 0 || Object.values(db.day.delivery || {}).some(number) || Object.values(db.day.withdrawal || {}).some(number);
  const text = `${changes.length} valeur${changes.length>1?'s':''} AVANT / ancien index ${changes.length>1?'seront remplacées':'sera remplacée'}.\n\nCette opération n’efface pas les comptages ni les mouvements déjà saisis aujourd’hui.${hasDayData?'\n\n⚠ Des données existent déjà pour la journée en cours.':''}`;

async function restoreBackup(file) {
  if (!file) return;
  const before = clone(db);
  try {
    const raw = JSON.parse(await file.text());
    if (!isCompatibleBackup(raw)) throw new Error('format');
    const restored = upgradeAlphaData(normalizeDb(raw));
    const articleCount = restored.products.filter(p => p.type !== 'pump').length, pumpCount = restored.products.filter(p => p.type === 'pump').length;
    const ok = await genericDialog({title: 'Restaurer cette sauvegarde ?', text: `${articleCount} articles · ${pumpCount} pompes · ${restored.archives.length} archive${restored.archives.length===1?'':'s'}\n\nLa base V200 de test sera remplacée. La V106 reste indépendante.`, okText: 'Restaurer'});
    if (!ok) return;
    saveRecovery(before, 'avant-restauration');
    db = restored;
    try {
      save()
    } catch (e) {
      db = before;
      try {
        save()
      } catch{}
      ;
      throw e
    }
    renderAll();
    toast('✓ Sauvegarde restaurée')
  } catch{
    genericDialog({title: 'Fichier invalide', text: 'Ce JSON ne contient pas une sauvegarde compatible V200 / V106.', cancel: false})
  }
}

    save();
    renderInventory()
  }
});
$('#activeProducts').addEventListener('click', e => {
  const rn = e.target.closest('[data-rename-product]');
  if (rn) {
    renameProduct(rn.dataset.renameProduct);
    return
  }
  const up = e.target.closest('[data-up]');
  if (up) moveProduct(up.dataset.up, -1);
  const down = e.target.closest('[data-down]');
  if (down) moveProduct(down.dataset.down, 1);
  const r = e.target.closest('[data-retire]');
  if (r) retireProduct(r.dataset.retire)
});
$('#inactiveProducts').addEventListener('click', e => {
  const b = e.target.closest('[data-restore-product]');
  if (b) {
    restoreProduct(b.dataset.restoreProduct);
    return
  }
  const d = e.target.closest('[data-delete-product]');
  if (d) deleteProductForever(d.dataset.deleteProduct)
});
$('#categoryAdmin').addEventListener('click', e => {
  const up = e.target.closest('[data-category-up]');
  if (up) {
    moveCategory(up.dataset.categoryUp, -1);
    return
  }
  const down = e.target.closest('[data-category-down]');
  if (down) {
    moveCategory(down.dataset.categoryDown, 1);
    return
  }
  const r = e.target.closest('[data-rename-category]');
  if (r) {
    renameCategory(r.dataset.renameCategory);
    return
  }
  const d = e.target.closest('[data-delete-category]');
  if (d) deleteCategory(d.dataset.deleteCategory)
});
$('#historyList').addEventListener('click', e => {
  const b = e.target.closest('[data-print-archive]');
  if (!b) return;
  const a = db.archives.find(x => x.date === b.dataset.printArchive);
  if (a) printSnapshot(a)
});
$('#genericOverlay').addEventListener('click', e => {
  if (e.target === $('#genericOverlay')) closeOverlay($('#genericOverlay'))
});
$('#movementOverlay').addEventListener('click', e => {
  if (e.target === $('#movementOverlay')) closeOverlay($('#movementOverlay'))
});

let staleWarningDate = '';

async function warnStaleDayIfNeeded() {
  if (!db.day || db.day.date === today() || !dayHasData(db.day) || staleWarningDate === db.day.date) return;
  staleWarningDate = db.day.date;
  await genericDialog({title: 'Inventaire précédent non clôturé', text: `L’inventaire du ${formatDate(db.day.date)} contient encore des données. Il reste ouvert pour éviter toute perte. Complétez-le puis utilisez « Terminer la journée » avant de commencer aujourd’hui.`, cancel: false, okText: 'Revenir au comptage'});
  showPanel('inventory')
}

function handleCalendarChange() {
  if (prepareNewCalendarDay()) renderAll(); else warnStaleDayIfNeeded()
}

function renderAll() {
  prepareNewCalendarDay();
  $('#headerDate').textContent = formatDate(db.day.date);
  renderCategories();
  renderInventory();
  updateFinishButton()
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') handleCalendarChange()
});
window.addEventListener('focus', handleCalendarChange);
renderAll();
if (!startupWarning) save();
setTimeout(() => {
  if (startupWarning) genericDialog({title: 'Récupération V200', text: startupWarning, cancel: false, okText: 'Continuer'}); else warnStaleDayIfNeeded()
}, 0);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(() => {});
}
</script>
</body>
</html>
